<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>带薪格斗 · 打工人的下班之路</title>
<style>
  :root{
    --bg:#eef4fa; --panel:#ffffff; --ink:#22303f; --ink2:#5b7086;
    --blue:#2f7fd0; --blue-l:#e6f1fb; --line:#d7e5f2; --red:#e05252; --green:#2fa36b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;}
  #app{height:100%;display:flex;align-items:center;justify-content:center;padding:14px;}
  #stage{position:relative;width:min(100%,1120px,calc((100vh - 28px) * 1.7778));aspect-ratio:16/9;background:#fff;
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 12px 34px rgba(38,78,120,.13);}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #hud{position:absolute;inset:0;pointer-events:none;padding:1.6% 2%;display:flex;flex-direction:column;justify-content:space-between;}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .bars{display:flex;flex-direction:column;gap:6px;width:34%;}
  .bar-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);}
  .bar-row .tag{width:34px;text-align:right;letter-spacing:.5px;flex:0 0 auto;}
  .bar{position:relative;flex:1;height:13px;border-radius:7px;background:#e8eef5;overflow:hidden;
    border:1px solid var(--line);}
  .bar i{position:absolute;left:0;top:0;bottom:0;width:100%;display:block;border-radius:7px;transition:width .12s linear;}
  .bar.hp i{background:linear-gradient(90deg,#5fb3f0,#2f7fd0);}
  .bar.hp.low i{background:linear-gradient(90deg,#f09595,#e05252);}
  .bar.en i{background:linear-gradient(90deg,#ffd88a,#f0a93a);}
  .bar.boss i{background:linear-gradient(90deg,#f09595,#c93b3b);}
  #center{text-align:center;flex:1;padding-top:2px;}
  #floorName{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.5px;}
  #waveName{display:block;font-size:11px;color:var(--ink2);margin-top:2px;}
  #bossWrap{position:absolute;left:50%;top:58px;transform:translateX(-50%);width:46%;display:none;
    text-align:center;background:rgba(255,255,255,.72);border:1px solid var(--line);
    border-radius:12px;padding:6px 12px 8px;}
  #bossWrap .bar{height:9px;background:#eef3f8;}
  #bossWrap .poise{position:relative;width:56%;margin:6px auto 0;height:5px;background:rgba(214,226,238,.55);
    border:1px solid rgba(196,214,230,.9);border-radius:3px;overflow:hidden;}
  #bossWrap .poise i{display:block;height:100%;width:0%;background:#e0a13c;transition:width .12s linear;}
  #bossWrap .poise.full i{background:#c93b3b;}
  #bossWrap .pips{display:flex;gap:4px;justify-content:center;margin-top:4px;}
  #bossWrap .pips s{width:18px;height:4px;border-radius:2px;background:rgba(120,150,180,.32);}
  #bossWrap .pips s.on{background:#c93b3b;}
  #bossWrap .arenaTag{position:absolute;right:7px;bottom:5px;display:none;text-align:right;
    background:rgba(255,255,255,.88);border-radius:6px;padding:1px 5px 3px;}
  #bossWrap .arenaTag b{display:block;font-size:9.5px;font-weight:600;letter-spacing:.3px;}
  #bossWrap .arenaTag i{display:block;width:56px;height:3px;margin-top:2px;margin-left:auto;
    background:rgba(200,214,228,.7);border-radius:2px;overflow:hidden;}
  #bossWrap .arenaTag u{display:block;height:100%;width:100%;text-decoration:none;background:#c93b3b;}
  #bossName{font-size:12px;color:#a83232;margin-bottom:3px;letter-spacing:.5px;font-weight:600;}
  #comboBox{width:24%;text-align:right;font-size:12px;color:var(--ink2);opacity:0;transition:opacity .2s;}
  #comboBox.on{opacity:1;}
  #comboNum{font-size:30px;font-weight:700;color:var(--blue);line-height:1;font-variant-numeric:tabular-nums;}
  #comboWord{display:block;margin-top:2px;}
  #skills{display:flex;gap:8px;justify-content:center;pointer-events:none;}
  .sk{position:relative;width:78px;height:52px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.92);color:var(--ink);font:inherit;font-size:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    overflow:hidden;pointer-events:auto;}
  .sk b{font-size:13px;font-weight:600;}
  .sk .k{position:absolute;left:5px;top:3px;font-size:10px;color:#9db2c6;}
  .sk .cd{position:absolute;left:0;right:0;bottom:0;height:0%;background:rgba(47,127,208,.16);transition:height .1s linear;}
  .sk.ready{border-color:#9dc7ea;box-shadow:0 0 0 2px rgba(47,127,208,.08);}
  .sk.ult.charged{background:#fff6e3;border-color:#e8b95f;}
  .sk .cnt{position:absolute;right:5px;bottom:3px;font-size:10px;color:#9db2c6;}
  #touch{position:absolute;inset:0;display:none;pointer-events:none;}
  .tbtn{position:absolute;pointer-events:auto;border-radius:50%;border:1px solid var(--line);
    background:rgba(255,255,255,.86);color:var(--ink);font-size:12px;display:flex;align-items:center;justify-content:center;
    width:58px;height:58px;user-select:none;}
  .tbtn.on{background:#d9ecfb;}
  #overlay{position:absolute;inset:0;background:rgba(232,241,249,.93);display:flex;align-items:center;
    justify-content:center;text-align:center;padding:4%;transition:opacity .25s;backdrop-filter:blur(3px);}
  #overlay.hide{opacity:0;pointer-events:none;}
  #overlay .panel{max-width:600px;background:#fff;border:1px solid var(--line);border-radius:20px;
    padding:clamp(20px,3.2vw,34px) clamp(22px,4vw,44px);box-shadow:0 18px 46px rgba(38,78,120,.14);}
  #overlay h1{margin:0 0 6px;font-size:clamp(24px,3.4vw,38px);letter-spacing:2px;}
  #overlay .sub{margin:0 0 16px;color:var(--ink2);font-size:clamp(12px,1.3vw,15px);line-height:1.7;}
  #overlay .keys{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;margin:0 auto 18px;
    font-size:clamp(11px,1.15vw,13px);color:var(--ink2);text-align:left;max-width:520px;}
  #overlay .keys span b{color:var(--ink);font-weight:600;}
  #overlay .heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px;}
  #overlay .hero{background:#f7fbfe;border:1px solid var(--line);border-radius:12px;
    padding:8px 7px;cursor:pointer;text-align:left;transition:border-color .12s,background .12s,transform .12s;}
  #overlay .hero:hover{transform:translateY(-2px);border-color:#9dc7ea;}
  #overlay .hero.on{border-color:var(--blue);background:#e9f4fd;box-shadow:inset 0 0 0 1px rgba(47,127,208,.35);}
  #overlay .hero b{display:block;font-size:11px;color:var(--ink);letter-spacing:0;white-space:nowrap;}
  #overlay .hero .rl{display:block;font-size:9.5px;color:var(--ink2);margin:2px 0 5px;line-height:1.4;}
  #overlay .hero i{display:block;font-style:normal;font-size:9px;line-height:1.6;color:#6b8299;}
  #overlay .hint{font-size:11px;color:var(--ink2);line-height:1.9;margin:0 0 10px;}
  #overlay .hint b{color:var(--ink);}
  #overlay button{border:none;background:var(--blue);color:#fff;font:inherit;font-size:15px;font-weight:600;
    padding:11px 30px;border-radius:24px;cursor:pointer;letter-spacing:1px;}
  #overlay button:hover{filter:brightness(1.06);}
  #overlay .row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;}
  #overlay button.ghost{background:#fff;color:var(--blue);border:1.5px solid #b9d7ee;
    font-weight:600;padding:10px 22px;}
  #overlay button.ghost:hover{background:#f2f9ff;}
  #overlay .stats{margin:0 auto 18px;font-size:14px;color:var(--ink);line-height:2;
    background:#f6fafd;border:1px dashed var(--line);border-radius:12px;padding:12px 18px;}
  #overlay .stats b{color:var(--blue);font-size:17px;}
  .badge{display:inline-block;background:var(--blue-l);color:var(--blue);border-radius:12px;
    padding:3px 10px;font-size:12px;margin-bottom:14px;}
  #chips{position:absolute;left:2%;top:76px;display:flex;gap:6px;flex-wrap:wrap;max-width:46%;}
  .chip{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;
    padding:2px 8px;font-size:11px;color:var(--blue);}
  #overlay .cards{display:flex;gap:12px;justify-content:center;margin:8px 0 6px;flex-wrap:wrap;}
  .card{flex:1 1 150px;max-width:180px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:14px 12px;cursor:pointer;text-align:left;transition:transform .12s,border-color .12s;}
  .card:hover{transform:translateY(-3px);border-color:#9dc7ea;}
  .card .tag{display:inline-block;font-size:10px;color:var(--blue);background:var(--blue-l);
    border-radius:8px;padding:1px 7px;margin-bottom:8px;}
  .card h3{font-size:14px;margin:0 0 6px;font-weight:600;}
  .card h3 em{font-style:normal;font-size:10px;color:#a8bccd;margin-left:3px;vertical-align:top;}
  .card p{font-size:12px;color:var(--ink2);line-height:1.6;margin:0;}
  #overlay .grade{font-size:46px;font-weight:700;line-height:1;margin:0 0 4px;color:var(--blue);}
  #overlay .talent{display:flex;gap:8px;justify-content:center;margin:0 0 12px;flex-wrap:wrap;}
  #overlay .talent button{background:#f6fafd;color:var(--ink);border:1px solid var(--line);
    font-size:12px;padding:7px 10px;border-radius:10px;cursor:pointer;line-height:1.4;}
  #overlay .talent button:disabled{opacity:.4;cursor:default;}
  #overlay .meta{font-size:12px;color:var(--ink2);margin:0 0 10px;}
  #overlay .diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px;}
  #overlay .diff{background:#f7fbfe;border:1px solid var(--line);border-radius:12px;padding:7px 9px;
    cursor:pointer;text-align:left;transition:border-color .12s,background .12s;}
  #overlay .diff:hover{border-color:#9dc7ea;}
  #overlay .diff.on{border-color:var(--blue);background:#e9f4fd;box-shadow:inset 0 0 0 1px rgba(47,127,208,.35);}
  #overlay .diff b{display:block;font-size:12px;color:var(--ink);}
  #overlay .diff span{display:block;font-size:9.5px;color:var(--ink2);margin-top:1px;line-height:1.45;}
  #diffTag{display:inline-block;font-size:10px;color:#b07d0a;background:rgba(255,238,196,.92);
    border:1px solid rgba(224,161,60,.45);border-radius:8px;padding:0 6px;margin-left:6px;vertical-align:1px;}
  @media (pointer:coarse){
    #touch{display:block;}
    .sk{width:56px;height:40px;}
    .sk b{font-size:11px;}
    .sk .k{font-size:9px;left:3px;top:2px;}
    .tbtn{width:48px;height:48px;font-size:11px;}
  }
  #rotate{position:fixed;inset:0;background:#eef4fa;z-index:99;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:10px;
    font-size:15px;color:#5b7086;letter-spacing:1px;}
  #rotate b{font-size:18px;color:#22303f;}
  @media (orientation:portrait) and (max-width:820px){
    #rotate{display:flex;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="hud">
      <div class="top">
        <div class="bars">
          <div class="bar-row"><span class="tag">工时</span><div class="bar hp" id="hpBar"><i id="hpFill"></i></div></div>
          <div class="bar-row"><span class="tag">怒气</span><div class="bar en" id="enBar"><i id="enFill" style="width:0%"></i></div></div>
        </div>
        <div id="center">
          <div id="floorName">第 1 层 · 开放工位区<span id="diffTag">正式员工</span></div>
          <span id="waveName">第 1 波</span>
        </div>
        <div id="comboBox">
          <div id="comboNum">0</div>
          <span id="comboWord"></span>
        </div>
      </div>
      <div id="chips"></div>
      <div id="bossWrap">
        <div id="bossName">主管 · 老张</div>
        <div class="bar boss"><i id="bossFill" style="width:100%"></i></div>
        <div class="poise" id="bossPoise"><i id="poiseFill"></i></div>
        <div class="pips" id="bossPips"><s class="on"></s><s></s><s></s></div>
        <div class="arenaTag" id="arenaTag"><b id="arenaName">场地状态</b><i><u id="arenaFill"></u></i></div>
      </div>
      <div id="skills">
        <button class="sk" data-key="Digit1"><span class="k">1</span><b>喝水</b><span class="cnt" id="cd1"></span><i class="cd" id="sw1"></i></button>
        <button class="sk" data-key="Digit2"><span class="k">2</span><b>摸鱼</b><span class="cnt" id="cd2"></span><i class="cd" id="sw2"></i></button>
        <button class="sk" data-key="Digit3"><span class="k">3</span><b>开早会</b><span class="cnt" id="cd3"></span><i class="cd" id="sw3"></i></button>
        <button class="sk ult" data-key="Digit4"><span class="k">4</span><b>提离职</b><span class="cnt" id="cd4"></span><i class="cd" id="sw4"></i></button>
      </div>
    </div>

    <div id="touch">
      <div class="tbtn" data-key="KeyA" style="left:14px;bottom:86px;">◀</div>
      <div class="tbtn" data-key="KeyD" style="left:84px;bottom:86px;">▶</div>
      <div class="tbtn" data-key="KeyJ" style="right:14px;bottom:150px;">轻击</div>
      <div class="tbtn" data-key="KeyK" style="right:84px;bottom:150px;">重击</div>
      <div class="tbtn" data-key="KeyL" style="right:14px;bottom:86px;">闪避</div>
    </div>

    <div id="overlay">
      <div class="panel" id="panel"></div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =============== 基础常量 =============== */
var cv = document.getElementById('game');
var ctx = cv.getContext('2d');
var W = 960, H = 540, FLOOR = 470;
var dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * dpr; cv.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

function rnd(a, b){ return a + Math.random() * (b - a); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

/* =============== 输入 =============== */
var keys = Object.create(null);
var pressed = Object.create(null);
var MAP = {
  left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  light: ['KeyJ'], heavy: ['KeyK'], dodge: ['KeyL', 'Space', 'ShiftLeft'],
  s1: ['Digit1'], s2: ['Digit2'], s3: ['Digit3'], s4: ['Digit4']
};
function down(a){ for (var i = 0; i < MAP[a].length; i++) if (keys[MAP[a][i]]) return true; return false; }
function hit(a){ for (var i = 0; i < MAP[a].length; i++) if (pressed[MAP[a][i]]) return true; return false; }

window.addEventListener('keydown', function(e){
  // 选卡态：1/2/3 直接选卡，且不要把按键漏进战斗输入
  if (game.state === 'card' && cardPick && /^Digit[1-3]$/.test(e.code)){
    e.preventDefault(); cardPick(parseInt(e.code.slice(5), 10) - 1); return;
  }
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code) >= 0) e.preventDefault();
  if (!e.repeat) pressed[e.code] = true;
  keys[e.code] = true;
  if (e.code === 'Enter' && (game.state === 'title' || game.state === 'win' || game.state === 'lose')) start();
  if (e.code === 'KeyR' && (game.state === 'win' || game.state === 'lose')) start();
  if ((e.code === 'KeyM' || e.code === 'Escape') && (game.state === 'win' || game.state === 'lose')) backToMenu();
});
window.addEventListener('keyup', function(e){ keys[e.code] = false; });

document.querySelectorAll('[data-key]').forEach(function(el){
  var k = el.dataset.key;
  function on(e){ e.preventDefault(); if (!keys[k]) pressed[k] = true; keys[k] = true; el.classList.add('on'); }
  function off(e){ if (e) e.preventDefault(); keys[k] = false; el.classList.remove('on'); }
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
});

/* =============== 关卡数据 =============== */
var STAGES = [
  { name: '第 1 层 · 开放工位区', sub: '18:00 到了，你只想下班', bg: 'desk',
    waves: [
      [ { kind: 'req', n: 3 } ],
      [ { kind: 'req', n: 2 }, { kind: 'pot', n: 2 } ],
      [ { boss: 'manager' } ]
    ] },
  { name: '第 2 层 · 茶水间', sub: '下午茶是兵家必争之地', bg: 'pantry',
    waves: [
      [ { kind: 'pot', n: 3 } ],
      [ { kind: 'dog', n: 2 }, { kind: 'req', n: 2 } ],
      [ { boss: 'director' } ]
    ] },
  { name: '第 3 层 · 会议室', sub: '「简单开个短会，十分钟」', bg: 'meeting',
    waves: [
      [ { kind: 'hr', n: 2 }, { kind: 'req', n: 2 } ],
      [ { kind: 'dog', n: 2 }, { kind: 'hr', n: 1 }, { kind: 'pot', n: 1 } ],
      [ { boss: 'hrboss' } ]
    ] },
  { name: '第 4 层 · 文印室', sub: '打印机永远在你要用的时候卡纸', bg: 'print',
    waves: [
      [ { kind: 'dog', n: 3 } ],
      [ { kind: 'sec', n: 2 }, { kind: 'req', n: 2 } ],
      [ { boss: 'guardboss' } ]
    ] },
  { name: '第 5 层 · 机房', sub: '空调 16 度，服务器比你热', bg: 'server',
    waves: [
      [ { kind: 'sec', n: 2 }, { kind: 'dog', n: 2 } ],
      [ { kind: 'hr', n: 2 }, { kind: 'pot', n: 2 }, { kind: 'dog', n: 1 } ],
      [ { boss: 'techboss' } ]
    ] },
  { name: '第 6 层 · 老板办公室', sub: '最后一道门，也是最厚的门', bg: 'boss',
    waves: [
      [ { kind: 'sec', n: 2 }, { kind: 'dog', n: 2 }, { kind: 'hr', n: 1 } ],
      [ { kind: 'pot', n: 3 }, { kind: 'dog', n: 2 } ],
      [ { boss: 'bigboss' } ]
    ] }
];

/* 难度：不靠加血条制造难度，主要调「前摇长度」和「Boss 连招段数」——
   这两个直接改变玩家的操作门槛；血量伤害只做小幅微调。 */
var DIFFS = [
  { k: 'easy',   name: '实习生',   tag: '先下班再说',
    ehp: 0.80, edmg: 0.70, wind: 1.18, cnt: 0, bhp: 0.85, combo: 2, ph2: 0.50, drop: 1.5,  coin: 0.7 },
  { k: 'normal', name: '正式员工', tag: '正常上班',
    ehp: 1.00, edmg: 1.00, wind: 1.00, cnt: 0, bhp: 1.00, combo: 3, ph2: 0.65, drop: 1.0,  coin: 1.0 },
  { k: 'hard',   name: '卷王',     tag: '主动加班',
    ehp: 1.30, edmg: 1.30, wind: 0.88, cnt: 1, bhp: 1.25, combo: 4, ph2: 0.70, drop: 0.85, coin: 1.7 }
];
var DIFF = 1;
function D(){ return DIFFS[DIFF]; }

var EKIND = {
  req: { hp: 32, speed: 148, dmg: 4, range: 60, scale: 0.86, color: '#4b5b6e', accent: '#e0a13c', cd: [1.4, 2.2], name: '临时需求', moves: ['poke', 'flurry'] },
  pot: { hp: 48, speed: 108, dmg: 5, range: 300, scale: 1.0, color: '#3f4e5f', accent: '#5b8fc9', cd: [1.9, 2.8], name: '甩锅同事', ranged: true, moves: ['throw', 'bounce'] },
  dog: { hp: 78, speed: 90, dmg: 8, range: 68, scale: 1.14, color: '#3a4757', accent: '#8b6fc4', cd: [1.9, 2.7], name: '加班狗', moves: ['slam', 'leap'] },
  hr:  { hp: 46, speed: 122, dmg: 5, range: 320, scale: 0.94, color: '#40384a', accent: '#d76a9a', cd: [1.7, 2.5], name: '人事专员', ranged: true, moves: ['fan', 'interview'] },
  sec: { hp: 96, speed: 104, dmg: 9, range: 74, scale: 1.18, color: '#2f4256', accent: '#3f9b7a', cd: [2.0, 3.0], name: '保安', moves: ['bash', 'guard'] }
};

/* 小怪招式：w 前摇 / a 判定 / r 收招 / hits 段数 / mult 伤害倍率 / type 判定方式
   melee 近身多段 · shot 单发 · shot3 扇形三发 · beam 落点光柱 · charge 冲刺
   leap 跳劈 · guard 举盾（减伤 70%，要绕背或用重击破） */
var EMOVE = {
  poke:     { w: 0.36, a: 0.20, r: 0.36, hits: 1, mult: 1.0, type: 'melee', say: '过来一下' },

function beep(freq, dur, type, vol, slide){
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(50, freq * slide), t + dur);
    g.gain.setValueAtTime(vol || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}

      if (crit) floatText(e.x, FLOOR - 165 * e.scale, '签字生效', '#2f7fd0', 17);
      if (WP.lifesteal){
        var steal = Math.max(1, Math.round(dmg * WP.lifesteal));
        P.hp = Math.min(P.maxhp, P.hp + steal);
        floatText(P.x, FLOOR - 200, '+' + steal, '#2fa36b', 15);
      }
      if (WP.range > 1.6){
        game.shots.push({ x: e.x, y: FLOOR - 90, vx: P.facing * 0, dmg: 0, r: 4, kind: 'nail', life: 0.18, friendly: true, noHit: true });
      }
      hitAny = true;
    }
  }
  if (hitAny){
    game.hitstop = isLight ? 0.035 : 0.06;
    game.shake = Math.max(game.shake, isLight ? 3 : 6);
    beep(isLight ? 330 : 170, isLight ? 0.06 : 0.13, isLight ? 'square' : 'sawtooth', 0.05, 0.55);
  }
}

function damageEnemy(e, dmg, kb, stun){
  if (e.markT > 0) dmg = Math.max(1, Math.round(dmg * 1.25));
  // 举盾：站在正面只能打出三成伤害，绕背或抓收招才有效
  if (e.guardT > 0 && (P.x - e.x) * e.facing > 0){
    dmg = Math.max(1, Math.round(dmg * 0.3));
    floatText(e.x, FLOOR - 150 * e.scale, '挡下了', '#3f9b7a', 15);
  }
  // 力竭：受伤加成，这是给玩家的输出窗口
  if (e.isBoss && e.broken > 0) dmg = Math.round(dmg * 1.35);
  e.hp -= dmg;
  e.hurtT = stun;
  e.vx = Math.sign(e.x - P.x || 1) * kb;
  var eg = (dmg >= 18 ? 8 : 4) * (1 + save.t.en * 0.15 + (has('resign') ? 0.5 : 0));
  P.energy = clamp(P.energy + eg, 0, 100);
  addCombo();
  floatText(e.x + rnd(-8, 8), FLOOR - 120 * e.scale, '-' + dmg, '#e05252', dmg >= 18 ? 24 : 18);
  spark(e.x, FLOOR - 80 * e.scale, dmg >= 18 ? 14 : 8, '#ffcf6b');
  // Boss 架势：打满就力竭
  if (e.isBoss && e.broken <= 0 && !e.stun){
    e.poise += dmg * 1.5;
    e.poiseT = 1.6;
    if (e.poise >= e.poiseMax) breakBoss(e);
  }
  if (e.hp <= 0) killEnemy(e);
}

function rollDrop(e){
  var chance = (e.isBoss ? 0.65 : (e.affix ? 0.16 : 0.06)) * D().drop;
  if (Math.random() > chance) return;
  var pool = (e.isBoss || e.affix) && Math.random() < 0.55 ? WEAPON_POOL_HI : WEAPON_POOL;
  var id = pick(pool);
  game.drops.push({ x: clamp(e.x, 70, W - 80), id: id, t: 0, life: 14, vy: -120, y: FLOOR - 40 });
  floatText(e.x, FLOOR - 190, '掉了个东西', '#c08a12', 16);
}

function updateDrops(dt){
  for (var i = game.drops.length - 1; i >= 0; i--){
    var d = game.drops[i];
    d.t += dt; d.life -= dt;
    d.y = Math.min(FLOOR - 22, d.y + (d.vy || 0) * dt);
    if (d.y >= FLOOR - 22) d.vy = 0;
    var dx = P.x - d.x;
    if (P.hp > 0 && Math.abs(dx) < 74) d.x += Math.sign(dx) * 130 * dt;
    if (P.hp > 0 && Math.abs(P.x - d.x) < 36 && d.t > 0.25){
      P.weapon = d.id;
      var w = WEAPONS[d.id];
      floatText(P.x, FLOOR - 196, '换上 ' + w.name, '#c08a12', 21);
      ring(P.x, FLOOR - 80, 10, 92, '#e9c46a', 0.5);
      beep(760, 0.1, 'sine', 0.06, 1.35);
      beep(1040, 0.1, 'sine', 0.05, 1.2);
      game.drops.splice(i, 1);
      renderChips();
      continue;
    }
    if (d.life <= 0) game.drops.splice(i, 1);
  }
}

function drawWeaponIcon(id, x, y, rot, sc){
  var w = WEAPONS[id] || WEAPONS.notebook;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(sc || 1, sc || 1);
  ctx.lineJoin = 'round';
  if (id === 'keyboard'){
    ctx.fillStyle = '#6f8399';
    ctx.beginPath(); ctx.roundRect(-13, -6, 26, 12, 2); ctx.fill();
    ctx.fillStyle = '#dbe9f4';
    for (var r = 0; r < 2; r++) for (var c = 0; c < 5; c++) ctx.fillRect(-10 + c * 4.6, -3.5 + r * 4.4, 3, 3);
  } else if (id === 'stapler'){
    ctx.fillStyle = '#e05252';
    ctx.beginPath(); ctx.roundRect(-10, -5, 20, 9, 2); ctx.fill();
    ctx.fillStyle = '#b23f3f';
    ctx.beginPath(); ctx.roundRect(-8, 3, 15, 4, 2); ctx.fill();
  } else if (id === 'mug'){
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#d8b3a6'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.roundRect(-7, -7, 13, 14, 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(7, 0, 4, -1.2, 1.2); ctx.stroke();
    ctx.fillStyle = '#f2b6a0'; ctx.fillRect(-5, 2, 9, 3);
  } else if (id === 'chair'){
    ctx.fillStyle = '#cfe0ee'; ctx.strokeStyle = '#a9c3d8'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(-11, -10, 22, 8, 3); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(-9, 0, 18, 6, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#a9c3d8'; ctx.fillRect(-6, 6, 2, 5); ctx.fillRect(4, 6, 2, 5);
  } else if (id === 'monitor'){
    ctx.fillStyle = '#c9e2f5'; ctx.strokeStyle = '#8fb6d8'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.roundRect(-12, -9, 24, 16, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7fb6e6'; ctx.fillRect(-9, -6, 18, 10);
    ctx.fillStyle = '#8fb6d8'; ctx.fillRect(-3, 7, 6, 4);
  } else if (id === 'pen'){
    ctx.strokeStyle = '#2f7fd0'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-11, 4); ctx.lineTo(11, -4); ctx.stroke();
    ctx.strokeStyle = '#cfe0ee'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(6, -2); ctx.lineTo(12, -5); ctx.stroke();
  } else if (id === 'trophy'){
    ctx.fillStyle = '#e9c46a';
    ctx.beginPath(); ctx.roundRect(-8, 4, 16, 4, 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-7, 4); ctx.lineTo(7, 4); ctx.lineTo(4, -6); ctx.lineTo(-4, -6); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -8, 6, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#9db2c6'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.roundRect(-10, -8, 22, 16, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#cfe6f7'; ctx.fillRect(-6, -4, 14, 8);
  }
  ctx.restore();
}

function drawDrops(){
  for (var i = 0; i < game.drops.length; i++){
    var d = game.drops[i];
    var w = WEAPONS[d.id];
    var bob = Math.sin(d.t * 4) * 3;
    var blink = d.life < 3 && Math.floor(d.life * 6) % 2 === 0;

    if (blink) ctx.globalAlpha = 0.4;
    // 地面光斑
    var g = ctx.createRadialGradient(d.x, FLOOR + 2, 2, d.x, FLOOR + 2, 46);
    g.addColorStop(0, rgbaOf(w.color, 0.45)); g.addColorStop(1, rgbaOf(w.color, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(d.x, FLOOR + 2, 46, 16, 0, 0, 7); ctx.fill();
    // 武器本体
    drawWeaponIcon(d.id, d.x, d.y + bob, Math.sin(d.t * 2) * 0.12, 1.5);
    // 名字
    ctx.font = '600 11px system-ui,sans-serif'; ctx.textAlign = 'center';
    var nw = ctx.measureText(w.name).width;

    ctx.beginPath(); ctx.roundRect(d.x - nw / 2 - 7, d.y - 50, nw + 14, 16, 8); ctx.fill();
    ctx.fillStyle = '#b8860b';

function killEnemy(e){
  game.killed++;
  game.shake = Math.max(game.shake, 8);
  spark(e.x, FLOOR - 70, 20, '#ffd166', 300);
  beep(260, 0.1, 'triangle', 0.05, 0.45);
  floatText(e.x, FLOOR - 150, pick(['驳回！','已读不回','抄送全员','这个需求做不了','先这样吧']),
    '#2f7fd0', 20);
  if (e.affix === 'guo'){
    game.zones.push({ x: e.x, r: 86, t: 0, dur: 0.32, dmg: 8, kind: 'burst', done: false });
    floatText(e.x, FLOOR - 118, '锅炸了', '#8b6fc4', 18);
  }
  if (e.isBoss) game.bossRef = null;
  rollDrop(e);
}

function hitPlayer(dmg, srcX, kb){
  if (P.iframe > 0 || P.slack > 0 || P.state === 'dodge' || P.state === 'dash') return;
  if (has('keyboard')) dmg = Math.max(1, Math.round(dmg * 1.15));
  if (P.drT > 0 && P.dr > 0) dmg = Math.max(1, Math.round(dmg * (1 - P.dr)));
  if (P.shield > 0){
    var absorb = Math.min(P.shield, dmg);
    P.shield -= absorb; dmg -= absorb;
    floatText(P.x, FLOOR - 150, '挡住了 ' + absorb, '#2f7fd0', 17);
    spark(P.x, FLOOR - 90, 8, '#7fb6e6');
    if (dmg <= 0){ P.iframe = 0.34; return; }
  }
  P.hp -= dmg; game.hitsTaken++;
  if (srcX !== undefined){ P.x = clamp(P.x + Math.sign(P.x - srcX || 1) * (kb === undefined ? 26 : kb), 60, W - 120); }
  P.iframe = 0.72; P.hurtT = 0.28; P.state = 'hurt'; P.t = 0;
  P.energy = clamp(P.energy + 5, 0, 100);
  game.shake = Math.max(game.shake, 9);
  beep(130, 0.18, 'sawtooth', 0.08, 0.6);
  floatText(P.x, FLOOR - 150, '-' + dmg, '#c93b3b', 20);
  game.combo = 0; game.comboT = 0;
  if (P.hp <= 0){
    if (has('guanxi') && !P.usedSave){
      P.usedSave = true; P.hp = 40; P.iframe = 1.4;
      game.shake = Math.max(game.shake, 12);
      ring(P.x, FLOOR - 70, 10, 130, '#d4a017', 0.6);
      floatText(P.x, FLOOR - 185, '关系户保命', '#c08a12', 22);
      return;
    }
    P.hp = 0; loseGame();
  }
}

function addCombo(){
  game.combo++;
  game.comboT = 2.2;
  if (game.combo > game.maxCombo) game.maxCombo = game.combo;
}

function comboWord(n){
  if (n >= 12) return '建议直接提离职';
  if (n >= 8) return '这波很勇';
  if (n >= 5) return '手速可以';
  if (n >= 3) return '有点东西';
  return '';
}

function stunFront(range, t, dmg, kb){
  P.castLock = Math.max(P.castLock, 0.3);
  ring(P.x + P.facing * 56, FLOOR - 66, 14, range * 0.86, '#2f7fd0', 0.45);
  game.shake = Math.max(game.shake, 5);

  for (var i = 0; i < game.enemies.length; i++){
    var e = game.enemies[i];

    var dx = (e.x - P.x) * P.facing;
    if (dx < -40 || dx > range) continue;

function stunAll(radius, t, dmg, freeze){

  for (var i = 0; i < game.enemies.length; i++){
    var e = game.enemies[i];

    if (Math.abs(e.x - P.x) > radius) continue;

}
function burstAll(dmg, stunT){

/* 召唤：师兄帮你打工 */
function summonAlly(t){
  P.castLock = Math.max(P.castLock, 0.3);
  var a = { x: clamp(P.x - P.facing * 46, 60, W - 120), facing: P.facing, life: t, cd: 0.3, animT: 0, scale: 0.84 };
  game.allies.push(a);
  ring(a.x, FLOOR - 70, 10, 76, '#8fd9b0', 0.5);
  spark(a.x, FLOOR - 90, 10, '#8fd9b0');
  beep(620, 0.14, 'sine', 0.05, 1.3);
}

function updateAllies(dt){
  for (var i = game.allies.length - 1; i >= 0; i--){
    var a = game.allies[i];
    a.life -= dt; a.animT += dt;
    if (a.life <= 0){ game.allies.splice(i, 1); continue; }
    var target = null, best = 1e9;
    for (var j = 0; j < game.enemies.length; j++){
      var e = game.enemies[j];
      if (e.hp <= 0) continue;
      var d = Math.abs(e.x - a.x);
      if (d < best){ best = d; target = e; }
    }
    if (target){
      a.facing = target.x > a.x ? 1 : -1;
      if (best > 66) a.x += a.facing * 200 * dt;
      else {
        a.cd -= dt;
        if (a.cd <= 0){
          a.cd = 1.15;
          damageEnemy(target, 5, 110, 0.14);
          floatText(target.x, FLOOR - 120 * target.scale, '师兄帮你', '#2fa36b', 14);
          spark(target.x, FLOOR - 80, 5, '#8fd9b0', 160);
        }
      }
    } else {
      var dx = P.x - a.x - P.facing * 52;
      if (Math.abs(dx) > 10) a.x += Math.sign(dx) * 210 * dt;
      a.facing = P.facing;
    }
    a.x = clamp(a.x, 50, W - 100);
  }
}

function drawAllies(){
  for (var i = 0; i < game.allies.length; i++){
    var a = game.allies[i];
    drawShadow(a.x, a.scale);
    drawStick({ x: a.x, facing: a.facing, scale: a.scale, color: '#3f6fa8', hairStyle: 'bowl', hair: '#3b4453',
      tie: '#8fd9b0', state: 'walk', animT: a.animT, moving: true, hp: 1, maxhp: 1, uid: -2,
      hurtT: 0, stun: 0, accent: '#2fa36b' });
  }
}

/* 时间回溯：退回 2.4 秒前的工时与位置 */
function rollback(){
  P.castLock = Math.max(P.castLock, 0.36);
  // 取“最接近 2 秒前”的那一帧，避免刚开始打时直接把玩家扔回关卡起点
  var snap = null;
  if (game.hist && game.hist.length){
    snap = game.hist[0];
    for (var h = game.hist.length - 1; h >= 0; h--){
      if (game.time - game.hist[h].t >= 1.9){ snap = game.hist[h]; break; }
    }
  }
  ring(P.x, FLOOR - 80, 10, 130, '#2fa36b', 0.55);
  beep(300, 0.26, 'triangle', 0.06, 1.9);
  if (!snap){ P.iframe = Math.max(P.iframe, 0.5); return; }
  var ghostX = P.x;
  P.x = clamp(snap.x, 60, W - 120);
  P.hp = Math.max(P.hp, Math.min(P.maxhp, snap.hp));
  P.iframe = Math.max(P.iframe, 0.8);
  game.hist.length = 0;
  ring(ghostX, FLOOR - 70, 8, 60, '#8fd9b0', 0.35);
  floatText(P.x, FLOOR - 205, '回到 2 秒前', '#2fa36b', 18);
}

function teaZone(r, dur){

  game.zones.push({ x: clamp(P.x + P.facing * 90, 80, W - 80), r: r, t: 0, dur: dur, dmg: 0, kind: 'tea', done: false, tick: 0 });

}

/* 按槽位施放：0 续航 / 1 生存 / 2 控场 / 3 觉醒（每层一次） */
function castSkill(i){
  var sk = HERO.skills[i];
  if (!sk) return;
  if (P.castLock > 0 || P.state === 'hurt') return;
  if (i === 3){
    if (game.awakenUsed){
      floatText(P.x, FLOOR - 200, '这层的离职申请已经用过了', '#8b98a6', 17);
      return;
    }
    if (P.energy < 100){
      floatText(P.x, FLOOR - 200, '怒气不够（' + Math.floor(P.energy) + '%）', '#8b98a6', 16);
      return;
    }
    game.awakenUsed = true; P.energy = 0;
    ultFx(HERO.ult || '#2f7fd0', sk.name);
    game.shake = Math.max(game.shake, 12);
    sk.cast();
    return;
  }
  if (cds[i] > 0) return;
  var mul = (i === 0 && has('caffeine')) ? 0.6 : ((i === 2 && has('meeting')) ? 0.65 : 1);
  cds[i] = sk.cd * mul;
  sk.cast();
}

function tryDodge(){
  if (P.dodgeCd > 0 || P.state === 'hurt' || P.state === 'dodge') return;
  var dir = down('left') ? -1 : (down('right') ? 1 : P.facing);
  P.state = 'dodge'; P.t = 0; P.dodgeCd = 1.05 * (has('toilet') ? 0.5 : 1);
  P.iframe = 0.34; P.dodgeDir = dir;
  dust(P.x, FLOOR, 6);

  // 完美闪避：敌人正在起手的一瞬间按下闪避
  var danger = false;
  for (var i = 0; i < game.enemies.length; i++){
    var e = game.enemies[i];
    if (e.hp <= 0) continue;
    if (Math.abs(e.x - P.x) > 190) continue;
    if (e.state === 'windup' || e.state === 'attack' || (e.act && e.act.phase === 'windup')){ danger = true; break; }
  }
  if (!danger){
    for (var z = 0; z < game.zones.length; z++){
      var zo = game.zones[z];
      if (!zo.done && zo.t > zo.dur - 0.3 && Math.abs(P.x - zo.x) < zo.r + 40){ danger = true; break; }
    }
  }
  if (danger){
    game.slowT = 0.7; P.perfectT = 3; game.perfects++;
    P.energy = clamp(P.energy + 12, 0, 100);
    ring(P.x, FLOOR - 70, 12, 96, '#7fc4f5', 0.5);
    floatText(P.x, FLOOR - 175, '完美闪避！', '#2f7fd0', 24);
    beep(760, 0.16, 'sine', 0.07, 1.5);
    game.shake = Math.max(game.shake, 5);
  } else {
    floatText(P.x, FLOOR - 150, '带薪如厕', '#5b7086', 15);
  }
}

/* 绩效重估：临时砍掉上限，场地状态结束后恢复 */
function applyMaxHpCut(k){
  if (!P.baseMaxhp) P.baseMaxhp = P.maxhp;
  P.maxhp = Math.max(20, Math.round(P.baseMaxhp * (1 - k)));
  P.hp = Math.min(P.hp, P.maxhp);
  floatText(P.x, FLOOR - 205, '工时上限 -' + Math.round(k * 100) + '%', '#b45309', 20);
}
function restoreMaxHp(){
  if (P.baseMaxhp){ P.maxhp = P.baseMaxhp; P.baseMaxhp = 0; }
  P.hp = Math.min(P.hp, P.maxhp);
}

/* 背锅处决：对残血敌人按重击，直接带走 */
function tryExecute(){
  for (var i = 0; i < game.enemies.length; i++){
    var e = game.enemies[i];
    if (e.hp <= 0) continue;
    // Boss 只有在力竭时才能被处决，一次打掉 14% 上限
    if (e.isBoss){
      if (!(e.broken > 0)) continue;
      if (Math.abs(e.x - P.x) > 130) continue;
      game.hitstop = 0.16; game.shake = 16;
      var big = Math.round(e.maxhp * 0.14);
      floatText(e.x, FLOOR - 215, '结算面谈', '#c93b3b', 28);
      ring(e.x, FLOOR - 84, 14, 130, '#c93b3b', 0.55);
      spark(e.x, FLOOR - 84, 28, '#ff9f68', 340);
      beep(70, 0.3, 'sawtooth', 0.1, 0.4);
      damageEnemy(e, big, 120, 0.3);
      e.broken = Math.max(0.2, e.broken);
      return true;
    }
    if (e.hp > e.maxhp * 0.28) continue;
    var dx = (e.x - P.x) * P.facing;
    if (dx < -30 || dx > 92 * ((WEAPONS[P.weapon] || WEAPONS.notebook).range || 1)) continue;
    game.hitstop = 0.12; game.shake = 14;
    P.hp = Math.min(P.maxhp, P.hp + 6);
    P.energy = clamp(P.energy + 12, 0, 100);
    floatText(P.x, FLOOR - 195, '背锅处决', '#c93b3b', 26);
    ring(e.x, FLOOR - 70, 10, 90, '#c93b3b', 0.45);
    spark(e.x, FLOOR - 70, 22, '#ff9f68', 300);
    beep(90, 0.22, 'sawtooth', 0.09, 0.4);
    e.hp = 1;
    damageEnemy(e, 999, 380, 0.3);
    return true;
  }
  return false;
}

/* =============== 敌人 =============== */
var uidSeq = 1;

function spawnEnemy(kind, x){
  var d = EKIND[kind], df = D();
  var e = {
    uid: uidSeq++, kind: kind, isBoss: false, x: x, vx: 0,
    hp: Math.round(d.hp * df.ehp), maxhp: 0,
    speed: d.speed, dmg: Math.max(1, Math.round(d.dmg * df.edmg * 10) / 10),
    range: d.range, scale: d.scale, color: d.color,
    facing: -1, state: 'walk', timer: 0, animT: rnd(0, 6), hurtT: 0, stun: 0,
    atkCd: rnd(0.6, 1.4), cdMin: d.cd[0], cdMax: d.cd[1], accent: d.accent,
    deadT: 0, name: d.name, ranged: !!d.ranged, hitDone: false,
    moves: d.moves.slice(0), atk: d.moves[0], hop: 0, guardT: 0, sub: 0
  };
  e.maxhp = e.hp;
  if (game.stage >= 1 && Math.random() < 0.42){
    var roll = Math.random();
    if (roll < 0.4){
      e.affix = 'juan'; e.speed *= 1.35; e.dmg += 2;
      e.hp = Math.round(e.hp * 0.85); e.accent = '#e05252';
    } else if (roll < 0.78){
      e.affix = 'guanxi'; e.hp = Math.round(e.hp * 1.85);
      e.dmg = Math.max(2, Math.round(e.dmg * 0.7)); e.accent = '#d4a017';
    } else {
      e.affix = 'guo'; e.hp = Math.round(e.hp * 1.25); e.accent = '#8b6fc4';
    }
    e.maxhp = e.hp;
    e.name = AFFIX[e.affix] + '·' + e.name;
  }
  game.enemies.push(e);
  return e;
}

function spawnBoss(key){
  var d = BOSS[key], df = D();
  var hp = Math.round(d.hp * df.bhp);
  var e = {
    uid: uidSeq++, kind: key, isBoss: true, bossKey: key, x: 800, vx: 0,
    hp: hp, maxhp: hp, speed: d.speed, dmg: d.dmg, range: d.range,
    scale: d.scale, color: d.color, tie: d.tie, facing: -1, state: 'idle',
    animT: rnd(0, 6), hurtT: 0, stun: 0, actCd: 1.5, act: null, deadT: 0,
    name: d.name, def: d, phase: 1, poise: 0, poiseMax: 100, poiseT: 0,
    broken: 0, queue: [], comboLen: df.combo, guardT: 0, sub: 0, hop: 0
  };
  game.enemies.push(e);
  game.bossRef = e;
  showBanner(d.name, pick(d.lines));
  return e;
}

/* 连招：前几段是轻招，最后一段必是重招——玩家要记住「第三下躲」 */
function buildBossCombo(b){
  var pool = b.def['p' + b.phase] || b.def.p1;
  var light = [], i;
  for (i = 0; i < pool.length; i++){
    if (pool[i] === 'swing' || pool[i] === 'jab' || pool[i] === 'knives' || pool[i] === 'charge') light.push(pool[i]);
  }
  if (!light.length) light = ['swing'];
  var n = Math.max(2, Math.min(b.comboLen, 4));
  var q = [];
  for (i = 0; i < n - 1; i++) q.push(pick(light));
  var heavy = [];
  for (i = 0; i < pool.length; i++){
    if (pool[i] === 'sweep' || pool[i] === 'slam' || pool[i] === 'swing') heavy.push(pool[i]);
  }
  q.push(pick(heavy.length ? heavy : ['swing']));
  return q;
}

function startBossAct(b, name){
  var def = ACT[name] || ACT.swing;
  b.state = 'act';
  b.act = { name: name, phase: 'windup', t: def.w * (b.phase === 3 ? 0.85 : (b.phase === 2 ? 0.94 : 1)), hitDone: false, sub: 0 };
  if (name === 'charge') b.chargeDir = Math.sign(P.x - b.x) || -1;
}

/* 场地状态：阶段转换时触发，打满一个阶段才出现一次 */
function triggerArena(a, b){
  if (!a) return;
  game.arena = { name: a.name, kind: a.kind, t: a.dur, dur: a.dur, color: a.color, tick: 0.6 };
  game.shake = Math.max(game.shake, 10);
  floatText(b.x, FLOOR - 215, a.name, a.color, 27);
  ring(b.x, FLOOR - 90, 24, 360, a.color, 0.7);
  beep(180, 0.5, 'sawtooth', 0.07, 0.6);
  beep(120, 0.6, 'triangle', 0.06, 0.5);
  if (a.kind === 'perf') applyMaxHpCut(0.2);
}

function enterBossPhase(b, ph){
  b.phase = ph;
  b.queue = [];
  b.act = null; b.broken = 0; b.poise = 0;
  b.state = 'idle'; b.actCd = 1.0;
  game.shake = Math.max(game.shake, 9);
  ring(b.x, FLOOR - 90, 16, 260, b.def.arena.color, 0.6);
  showBanner(b.name + ' · 第 ' + ph + ' 阶段', b.def.arena.tip);
  triggerArena(b.def.arena, b);
}

function breakBoss(b){
  if (b.broken > 0 || b.hp <= 0) return;
  b.broken = 2.3; b.poise = 0; b.poiseT = 0;
  b.act = null; b.queue = []; b.state = 'idle'; b.guardT = 0;
  game.shake = Math.max(game.shake, 11);
  floatText(b.x, FLOOR - 205, '力竭！按 K 砸他', '#c93b3b', 24);
  ring(b.x, FLOOR - 84, 12, 120, '#e05252', 0.5);
  beep(120, 0.3, 'square', 0.08, 0.5);
}

function updateBoss(b, dt){
  b.healCd = Math.max(0, (b.healCd || 0) - dt);
  if (b.guardT > 0) b.guardT -= dt;
  if (b.hurtT > 0){ b.hurtT -= dt; b.x += b.vx * dt; b.vx *= 0.86; return; }
  if (b.stun > 0){ b.stun -= dt; if (b.stun <= 0) b.froze = false; return; }

  // 力竭：完全不动，玩家输出窗口
  if (b.broken > 0){
    b.broken -= dt; b.state = 'idle'; b.moving = false;
    if (b.broken <= 0){ b.poise = 0; b.actCd = 0.55; }
    return;
  }
  // 架势自然回复（挨打后 1.6 秒内不回）
  if (b.poiseT > 0) b.poiseT -= dt;
  else if (b.poise > 0) b.poise = Math.max(0, b.poise - 24 * dt);

  var ratio = b.hp / b.maxhp;
  if (b.phase === 1 && ratio <= D().ph2) enterBossPhase(b, 2);
  else if (b.phase === 2 && ratio <= 0.32) enterBossPhase(b, 3);

  if (b.state === 'act' && b.act){
    var act = b.act, def = ACT[act.name];
    act.t -= dt;
    if (act.name === 'charge' && act.phase === 'active'){
      b.x += b.chargeDir * 540 * dt;
      b.x = clamp(b.x, 60, W - 110);
      if (!act.hitDone && Math.abs(P.x - b.x) < 76){ act.hitDone = true; hitPlayer(b.dmg + 2, b.x); }
    }
    if (act.name === 'jab' && act.phase === 'active'){
      var want = Math.floor((1 - act.t / def.a) * def.hits) + (act.t <= 0 ? 1 : 0);
      while (act.sub < def.hits && want > act.sub){
        act.sub++;
        ring(b.x + b.facing * 62, FLOOR - 84, 6, 46, '#e05252', 0.14);
        if (Math.abs(P.x - b.x) < b.range + 16) hitPlayer(Math.round(b.dmg * 0.7), b.x);
        game.shake = Math.max(game.shake, 3);
      }
    }
    if (act.phase === 'windup' && act.t <= 0){
      act.phase = 'active'; act.t = def.a;
      bossDo(b, act.name);
    } else if (act.phase === 'active' && act.t <= 0){
      act.phase = 'recover'; act.t = def.r;
    } else if (act.phase === 'recover' && act.t <= 0){
      if (b.queue && b.queue.length){
        startBossAct(b, b.queue.shift());
      } else {
        b.state = 'idle'; b.act = null;
        b.actCd = Math.max(0.5, rnd(1.0, 1.6) - (b.phase - 1) * 0.22);
      }
    }
    return;
  }

  b.actCd -= dt;
  var dx = P.x - b.x;
  b.facing = dx > 0 ? 1 : -1;
  var bs = b.speed * (game.arenaSlow || 1) * (b.phase >= 2 ? 1.12 : 1);
  if (Math.abs(dx) > b.range){
    b.x += Math.sign(dx) * bs * dt;
    b.state = 'walk'; b.moving = true;
  } else { b.state = 'idle'; b.moving = false; }

  if (b.actCd <= 0){
    if (!b.queue || !b.queue.length) b.queue = buildBossCombo(b);
    var name = b.queue.shift();
    if (name === 'swing' && Math.abs(dx) > b.range + 40) name = 'charge';
    if (name === 'heal' && (b.hp > b.maxhp * 0.7 || (b.healCd || 0) > 0)) name = 'slam';
    startBossAct(b, name);
  }
}

function bossDo(b, name){
  if (name === 'swing'){
    if (Math.abs(P.x - b.x) < b.range + 30) hitPlayer(b.dmg, b.x);
    ring(b.x + b.facing * 74, FLOOR - 80, 10, 74, '#e05252', 0.24);
    game.shake = Math.max(game.shake, 5);
    return;
  }
  if (name === 'sweep'){
    // 低扫：范围宽一倍，跳不过去只能拉远或闪避
    if (Math.abs(P.x - b.x) < b.range + 96) hitPlayer(Math.round(b.dmg * 1.1), b.x);
    ring(b.x, FLOOR - 40, 14, 180, '#e05252', 0.32);
    dust(b.x, FLOOR, 12);
    game.shake = Math.max(game.shake, 8);
    return;
  }
  if (name === 'slam'){
    // 砸地：近身伤害 + 两侧冲击波
    if (Math.abs(P.x - b.x) < b.range + 20) hitPlayer(Math.round(b.dmg * 1.35), b.x);
    for (var s1 = -1; s1 <= 1; s1 += 2){
      game.zones.push({ x: clamp(b.x + s1 * 150, 40, W - 40), r: 62, t: 0, dur: 0.7, dmg: Math.round(b.dmg * 0.8), kind: 'wave', done: false });
    }
    dust(b.x, FLOOR, 16);
    game.shake = Math.max(game.shake, 11);
    beep(70, 0.3, 'sawtooth', 0.09, 0.5);
    return;
  }
  if (name === 'guard'){
    b.guardT = ACT.guard.a;
    floatText(b.x, FLOOR - 190, '我按规定办事', '#3f9b7a', 17);
    ring(b.x, FLOOR - 84, 20, 96, '#3f9b7a', 0.4);
    return;
  }
  if (name === 'summon'){
    for (var i = 0; i < 2; i++) spawnEnemy('req', clamp(b.x - 40 + i * 80, 40, W - 40));
    floatText(b.x, FLOOR - 170, '这点活很快的', '#5b7086', 16);
    ring(b.x, FLOOR - 40, 10, 90, '#8fb6d8', 0.4);
    return;
  }
  if (name === 'aoe'){
    game.zones.push({ x: b.x, r: 210, t: 0, dur: 0.75, dmg: b.dmg, kind: 'meeting', done: false });
    floatText(b.x, FLOOR - 190, '全员紧急开会', '#7c3aed', 20);
    return;
  }
  if (name === 'knives'){
    for (var k = -1; k <= 1; k++){
      game.shots.push({ x: b.x + b.facing * 30, y: FLOOR - 96 + k * 26, vx: b.facing * 420,
        dmg: Math.round(b.dmg * 0.8), r: 11, kind: 'doc', life: 2.2 });
    }
    floatText(b.x, FLOOR - 180, '感觉差点意思', '#7c3aed', 18);
    return;
  }
  if (name === 'rain'){
    for (var j = -1; j <= 1; j++){
      game.zones.push({ x: clamp(P.x + j * 110 + rnd(-20, 20), 40, W - 40), r: 68, t: 0,
        dur: 0.9 + Math.abs(j) * 0.15, dmg: Math.round(b.dmg * 0.85), kind: 'paper', done: false });
    }
    floatText(b.x, FLOOR - 190, '下班前加个小功能', '#b45309', 20);
    return;
  }
  if (name === 'beam'){
    game.zones.push({ x: P.x, r: 78, t: 0, dur: 0.8, dmg: Math.round(b.dmg * 1.2), kind: 'beam', done: false });
    floatText(b.x, FLOOR - 185, '我只看结果', '#b45309', 20);
    return;
  }
  if (name === 'heal'){
    b.hp = Math.min(b.maxhp, b.hp + 30);
    b.healCd = 14;
    floatText(b.x, FLOOR - 175, '画饼 +30', '#2fa36b', 20);
    ring(b.x, FLOOR - 80, 10, 100, '#8fd9b0', 0.5);
    return;
  }
}

function pickEnemyMove(e){
  var m = pick(e.moves);
  // 六成概率避免连续两招一样，读招才有意义
  if (e.moves.length > 1 && m === e.atk && Math.random() < 0.6) m = pick(e.moves);
  return m;
}

function fireEnemyShot(e, mv){
  var kind = (e.kind === 'pot') ? 'pan' : 'doc';
  var n = (mv.type === 'shot3') ? 3 : 1;
  for (var i = 0; i < n; i++){
    var off = i - (n - 1) / 2;
    game.shots.push({
      x: e.x + e.facing * 26, y: FLOOR - 96 + off * 20, vx: e.facing * (mv.type === 'shot3' ? 380 : 430),
      dmg: Math.max(1, Math.round(e.dmg * (mv.type === 'shot3' ? 0.8 : 1))),
      r: 12, kind: kind, life: 2.2
    });
  }
  if (mv.say) floatText(e.x, FLOOR - 148 * e.scale, mv.say, '#6b8299', 13);
}

function startEnemyMove(e, mv){
  e.state = 'attack'; e.timer = mv.a; e.hitDone = false; e.sub = 0;
  if (mv.type === 'shot' || mv.type === 'shot3'){
    fireEnemyShot(e, mv);
  } else if (mv.type === 'beam'){
    game.zones.push({ x: P.x, r: 54, t: 0, dur: 0.85, dmg: e.dmg, kind: 'beam', done: false, warn: 0.42 });
    if (mv.say) floatText(e.x, FLOOR - 150 * e.scale, mv.say, '#d76a9a', 13);
  } else if (mv.type === 'charge'){
    e.chargeDir = Math.sign(P.x - e.x) || 1;
    if (mv.say) floatText(e.x, FLOOR - 150 * e.scale, mv.say, '#3f9b7a', 13);
  } else if (mv.type === 'leap'){
    e.leapX = clamp(P.x, 70, W - 110);
    if (mv.say) floatText(e.x, FLOOR - 150 * e.scale, mv.say, '#8b6fc4', 13);
  } else if (mv.type === 'guard'){
    e.state = 'guard'; e.timer = mv.a; e.guardT = mv.a;
    if (mv.say) floatText(e.x, FLOOR - 150 * e.scale, mv.say, '#3f9b7a', 13);
  } else if (mv.say){
    floatText(e.x, FLOOR - 150 * e.scale, mv.say, '#6b8299', 13);
  }
}

function runEnemyMove(e, mv, dt){
  if (mv.type === 'melee'){
    var hits = mv.hits || 1;
    var want = Math.floor((1 - e.timer / mv.a) * hits) + (e.timer <= 0 ? 1 : 0);
    while (e.sub < hits && want > e.sub){
      e.sub++;
      var lastHit = (e.sub === hits);
      ring(e.x + e.facing * e.range * 0.7, FLOOR - 70, 6, 40, '#e0a13c', 0.16);
      if (mv.feint && !lastHit) continue;   // 前两下是假动作，不出伤害
      if (Math.abs(P.x - e.x) < e.range * 1.15 + 16){
        hitPlayer(Math.max(1, Math.round(e.dmg * mv.mult)), e.x, mv.feint ? 34 : 16);
        spark(P.x, FLOOR - 96, 5, '#ffb0b0', 180);
      }
      if (mv.shake) game.shake = Math.max(game.shake, mv.shake);
    }
  } else if (mv.type === 'charge'){
    e.x = clamp(e.x + e.chargeDir * 470 * dt, 40, W - 90);
    if (!e.hitDone && Math.abs(P.x - e.x) < 62){
      e.hitDone = true;
      hitPlayer(Math.max(1, Math.round(e.dmg * (mv.mult || 1))), e.x);
    }
  } else if (mv.type === 'leap'){
    var t = 1 - e.timer / mv.a;
    e.hop = Math.sin(Math.min(1, t / 0.72) * Math.PI) * 74;
    if (t < 0.72) e.x += (e.leapX - e.x) * Math.min(1, dt * 10);
    if (!e.hitDone && e.timer <= 0.05){
      e.hitDone = true; e.hop = 0;
      game.shake = Math.max(game.shake, 6);
      dust(e.x, FLOOR, 8);
      ring(e.x, FLOOR - 6, 8, 78, '#b9a6e0', 0.3);
      if (Math.abs(P.x - e.x) < 72) hitPlayer(Math.max(1, Math.round(e.dmg * (mv.mult || 1))), e.x);
    }
  }
}

function updateEnemy(e, dt){
  e.animT += dt;
  if (e.markT > 0) e.markT -= dt;
  if (e.guardT > 0){ e.guardT -= dt; if (e.guardT <= 0 && e.state === 'guard') e.state = 'idle'; }
  if (e.hp <= 0){ e.deadT += dt; e.x += e.vx * dt; e.vx *= 0.9; return; }
  if (e.hurtT > 0){ e.hurtT -= dt; e.x += e.vx * dt; e.vx *= 0.86; return; }
  if (e.stun > 0){ e.stun -= dt; if (e.stun <= 0) e.froze = false; e.x += e.vx * dt; e.vx *= 0.9; return; }
  if (e.isBoss){ updateBoss(e, dt); return; }

  if (e.slowT > 0) e.slowT -= dt;
  var eSpeed = e.speed * (e.slowT > 0 ? (e.slowMul || 1) : 1) * (game.arenaSlow || 1);

  var dx = P.x - e.x;
  e.facing = dx > 0 ? 1 : -1;

  var mv = EMOVE[e.atk] || EMOVE.poke;

  if (e.state === 'windup'){
    e.timer -= dt;
    if (e.timer <= 0) startEnemyMove(e, mv);
    return;
  }
  if (e.state === 'attack'){
    e.timer -= dt;
    runEnemyMove(e, mv, dt);
    if (e.timer <= 0){
      e.state = 'idle'; e.hop = 0;
      e.atkCd = rnd(e.cdMin, e.cdMax) + (mv.r || 0.4);
    }
    return;
  }
  if (e.state === 'guard'){
    e.timer -= dt;
    if (e.timer <= 0){ e.state = 'idle'; e.atkCd = rnd(e.cdMin, e.cdMax); }
    return;
  }

  e.atkCd -= dt;
  var gap = Math.abs(dx);
  if (e.ranged){
    if (gap < 170){ e.x -= Math.sign(dx) * eSpeed * 0.9 * dt; e.moving = true; }
    else if (gap > e.range){ e.x += Math.sign(dx) * eSpeed * dt; e.moving = true; }
    else e.moving = false;
    if (e.atkCd <= 0 && gap < e.range + 40){
      e.atk = pickEnemyMove(e); mv = EMOVE[e.atk];
      e.state = 'windup'; e.timer = mv.w * D().wind;
    }
  } else {
    if (gap > e.range){ e.x += Math.sign(dx) * eSpeed * dt; e.moving = true; }
    else {
      e.moving = false;
      if (e.atkCd <= 0){
        e.atk = pickEnemyMove(e); mv = EMOVE[e.atk];
        e.state = 'windup'; e.timer = mv.w * D().wind;
      }
    }
  }
  e.x = clamp(e.x, 40, W - 90);
}

/* =============== 波次与流程 =============== */
function updateSpawns(dt){
  for (var i = game.spawnQ.length - 1; i >= 0; i--){
    var q = game.spawnQ[i];
    q.t -= dt;
    if (q.t <= 0){
      if (q.boss) spawnBoss(q.boss);
      else {
        var fromLeft = (q.side === 'L');
        var en = spawnEnemy(q.kind, fromLeft ? rnd(40, 110) : rnd(858, 930));
        if (fromLeft) en.facing = 1;
      }
      game.spawnQ.splice(i, 1);
    }
  }
}

/* 清场地状态：换层/结算时必须走这里，否则绩效场地的上限削减会残留到下一层 */
function clearArena(){
  if (game.arena && game.arena.kind === 'perf') restoreMaxHp();
  game.arena = null; game.arenaSlow = 1; game.dark = 0;
  if (P.hp > P.maxhp) P.hp = P.maxhp;
}

function startStage(i){
  clearArena();
  game.bossRef = null;   // 换层必须清 Boss 引用，否则上一层 Boss 的血条会挂在新楼层上
  game.stage = i; game.wave = -1; game.waveDelay = 1.5;
  game.zones.length = 0; game.shots.length = 0;
  game.awakenUsed = false;   // 离职觉醒：每层限一次
  cds[3] = 0;
  showBanner(STAGES[i].name, STAGES[i].sub);
}

function nextWave(){
  var st = STAGES[game.stage];
  game.wave++;
  if (game.wave >= st.waves.length) return;
  var cfg = st.waves[game.wave];
  game.spawnQ = [];
  game.bothSides = (game.wave === 1 && !(cfg.length === 1 && cfg[0].boss));
  var t = 0, idx = 0;
  for (var i = 0; i < cfg.length; i++){
    var g = cfg[i];
    if (g.boss){ game.spawnQ.push({ t: 0.3, boss: g.boss }); continue; }
    var n = g.n + (D().cnt > 0 ? 1 : 0);
    for (var k = 0; k < n; k++){
      game.spawnQ.push({ t: t, kind: g.kind, side: (game.bothSides && (idx % 2 === 1)) ? 'L' : 'R' });
      t += 0.42; idx++;
    }
    t += 0.25;
  }
  if (!(cfg.length === 1 && cfg[0].boss)){
    showBanner('第 ' + (game.wave + 1) + ' 波', game.bothSides ? '两边都来人了' : '对面来人了');
  }
}

function showBanner(title, sub){
  game.banner = { title: title, sub: sub || '' };
  game.bannerT = 2.0;
}

function start(){

  P.castLock = 0; P.hurtT = 0; P.atkKind = null; P.queued = null;

/* =============== 主更新 =============== */
function update(dt){
  game.time += dt;
  if (game.ultT > 0) game.ultT = Math.max(0, game.ultT - dt);
  // 回滚用的历史快照（约 2.4 秒）
  game.histT = (game.histT || 0) - dt;
  if (game.histT <= 0){
    game.histT = 0.12;
    if (!game.hist) game.hist = [];
    game.hist.push({ x: P.x, hp: P.hp, t: game.time });
    if (game.hist.length > 21) game.hist.shift();
  }
  // 工时告急：低频心跳
  if (P.hp > 0 && P.hp / P.maxhp < 0.28){
    game.lowBeep -= dt;
    if (game.lowBeep <= 0){
      game.lowBeep = 0.92;
      beep(88, 0.16, 'sine', 0.07, 0.75);
      beep(70, 0.14, 'sine', 0.05, 0.7);
    }
  } else {
    game.lowBeep = 0;
  }
  if (P.buffT > 0) P.buffT -= dt;
  for (var ci = 0; ci < 3; ci++) cds[ci] = Math.max(0, cds[ci] - dt);
  P.shieldT = Math.max(0, P.shieldT - dt);
  if (P.shieldT <= 0) P.shield = 0;
  P.drT = Math.max(0, P.drT - dt);
  if (P.drT <= 0) P.dr = 0;
  P.dmgT = Math.max(0, P.dmgT - dt);
  if (P.dmgT <= 0) P.dmgV = 1;
  P.dodgeCd = Math.max(0, P.dodgeCd - dt);
  P.iframe = Math.max(0, P.iframe - dt);
  P.castLock = Math.max(0, P.castLock - dt);
  if (P.slack > 0){
    P.slack -= dt;
    if (P.slackHeal > 0) P.hp = Math.min(P.maxhp, P.hp + P.slackHeal * dt);
    if (P.slack <= 0 && has('slacker')) P.fastT = 3;
  }
  if (game.slowT > 0) game.slowT -= dt;
  if (P.perfectT > 0) P.perfectT -= dt;
  if (P.fastT > 0) P.fastT -= dt;
  if (P.hurtT > 0) P.hurtT -= dt;
  P.animT += dt;

  if (game.comboT > 0){
    game.comboT -= dt;
    if (game.comboT <= 0){ game.combo = 0; }
  }

  var edt = dt * (game.slowT > 0 ? 0.35 : 1);
  updatePlayer(dt);
  updateSpawns(edt);

  for (var i = 0; i < game.enemies.length; i++) updateEnemy(game.enemies[i], edt);
  game.enemies = game.enemies.filter(function(e){ return !(e.hp <= 0 && e.deadT > 0.55); });

  updateShots(edt);
  updateZones(edt);
  updateArena(dt);
  updateDrops(dt);
  updateAllies(dt);
  updateParticles(dt);

  if (game.waveDelay > 0){
    game.waveDelay -= dt;
    if (game.waveDelay <= 0) nextWave();
  } else if (game.spawnQ.length === 0){
    var alive = false;
    for (var j = 0; j < game.enemies.length; j++) if (game.enemies[j].hp > 0) alive = true;
    if (!alive && game.state === 'play'){
      var st = STAGES[game.stage];
      if (game.wave >= st.waves.length - 1){
        if (game.stage >= STAGES.length - 1) winGame();
        else offerCards(function(){ startStage(game.stage + 1); }, '过关 · 上一层');
      } else {
        game.waveDelay = 1.4;
        showBanner('清场', '下一波马上到');
      }
    }
  }

  if (game.bannerT > 0) game.bannerT -= dt;
  game.shake *= Math.pow(0.001, dt);
  if (game.shake < 0.4) game.shake = 0;
}

/* 场地状态：Boss 换阶段时触发，持续 10-14 秒 */
function updateArena(dt){
  var a = game.arena;
  if (!a) return;
  a.t -= dt; a.tick -= dt;

  if (a.kind === 'spawn' && a.tick <= 0){
    a.tick = 2.6;
    var fromLeft = Math.random() < 0.5;
    var e = spawnEnemy('req', fromLeft ? rnd(50, 100) : rnd(850, 920));
    e.facing = fromLeft ? 1 : -1;
    ring(e.x, FLOOR - 60, 6, 50, a.color, 0.3);
  }
  if (a.kind === 'slow') game.arenaSlow = 0.76;
  else game.arenaSlow = 1;
  if (a.kind === 'dark') game.dark = Math.min(1, a.t / 0.6 > 1 ? 1 : a.t / 0.6);
  else game.dark = 0;

  if (a.t <= 0){ clearArena(); }
}

function updatePlayer(dt){
  if (P.hp <= 0) return;

  // 连招缓存：出招过程中按下轻/重击，会在本招结束后自动接上
  if (P.state === 'attack' || P.state === 'heavy'){
    if (hit('light')) P.queued = 'light';
    if (hit('heavy')) P.queued = 'heavy';
  }

  var move = 0;
  if (down('left')) move -= 1;
  if (down('right')) move += 1;

  if (P.state === 'hurt'){
    P.t += dt;
    if (P.t > 0.28){ P.state = 'idle'; P.t = 0; }
    return;
  }
  if (P.state === 'dash'){
    P.t += dt;
    var DT = 0.18, prog = Math.min(1, P.t / DT);
    var nx = P.x + P.dashDir * P.dashDist * (dt / DT);
    if (P.dashDmg > 0 && P.dashHit){
      var a0 = Math.min(P.x, nx) - 26, a1 = Math.max(P.x, nx) + 26;
      for (var di = 0; di < game.enemies.length; di++){
        var de = game.enemies[di];
        if (de.hp <= 0 || P.dashHit.indexOf(de.uid) >= 0) continue;
        if (de.x < a0 || de.x > a1) continue;
        P.dashHit.push(de.uid);
        damageEnemy(de, P.dashDmg, 260, 0.28);
      }
    }
    P.x = clamp(nx, 60, W - 120);
    if (prog >= 1){ P.state = 'idle'; P.t = 0; }
    return;
  }
  if (P.state === 'dodge'){
    P.t += dt;
    P.x += P.dodgeDir * 430 * (1 - P.t / 0.34) * dt;
    if (P.t > 0.34){ P.state = 'idle'; P.t = 0; }
    P.x = clamp(P.x, 60, W - 120);
    return;
  }
  if (P.state === 'attack' || P.state === 'heavy'){
    var k = P.atkKind;
    var dur = (k === 'light') ? LIGHT[P.atkStep] : HEAVY;
    var spd_up = Math.min(P.buffT > 0 ? (P.apt || 0.62) : 1, P.fastT > 0 ? 0.62 : 1) * (HERO.aspd || 1) * ((WEAPONS[P.weapon] || WEAPONS.notebook).spd || 1);
    var d0 = dur[0] * spd_up, d1 = dur[1] * spd_up, d2 = dur[2] * spd_up;
    P.t += dt;
    if (P.phase === 0 && P.t >= d0){ P.phase = 1; doPlayerHit(k, P.atkStep); }
    if (P.phase === 1 && P.t >= d0 + d1) P.phase = 2;
    if (P.t >= d0 + d1 + d2){
      if (P.queued === 'light' && k === 'light' && P.atkStep < 2){
        startAttack('light', P.atkStep + 1);
      } else if (P.queued === 'heavy'){
        startAttack('heavy', 0);
      } else {
        P.state = 'idle'; P.t = 0; P.queued = null;
      }
    }
    return;
  }
  if (P.castLock > 0){ P.moving = false; return; }

  // 移动
  var spd = HERO.speed;
  if (move !== 0){
    P.facing = move;
    P.x += move * spd * dt;
    P.moving = true;
    P.state = 'walk';
  } else {
    P.moving = false;
    P.state = 'idle';
  }
  P.x = clamp(P.x, 60, W - 120);

  // 动作输入
  if (hit('light')){
    if (P.state === 'attack' || P.state === 'heavy') P.queued = 'light';
    else startAttack('light', 0);
  }
  if (hit('heavy')){
    if (P.state === 'attack' || P.state === 'heavy') P.queued = 'heavy';
    else if (!tryExecute()) startAttack('heavy', 0);
  }
  if (hit('dodge')) tryDodge();
  if (hit('s1')) castSkill(0);
  if (hit('s2')) castSkill(1);
  if (hit('s3')) castSkill(2);
  if (hit('s4')) castSkill(3);
}

function updateShots(dt){
  for (var i = game.shots.length - 1; i >= 0; i--){
    var s = game.shots[i];
    s.x += s.vx * dt; s.life -= dt;

    if (s.friendly){
      // 被甩回去的锅，正好砸在同事身上
      var hitE = null;
      for (var j = 0; j < game.enemies.length; j++){
        var e = game.enemies[j];
        if (e.hp <= 0) continue;
        if (Math.abs(e.x - s.x) < 28 * e.scale){ hitE = e; break; }
      }
      if (hitE){
        damageEnemy(hitE, s.dmg, 260, 0.3);
        floatText(hitE.x, FLOOR - 150 * hitE.scale, '原路甩回', '#8b6fc4', 18);
        game.shots.splice(i, 1);
        continue;
      }
    } else if (Math.abs(s.x - P.x) < 30 && P.slack <= 0){
      if (P.state === 'dodge'){
        // 闪避接锅：把飞来的锅原路甩回去，伤害翻倍
        s.friendly = true; s.vx = -s.vx * 1.7;
        s.dmg = Math.round((s.dmg * 2 + 6) * (has('deflect') ? 1.8 : 1));
        s.life = 1.6; s.r = (s.r || 10) + 3;
        P.energy = clamp(P.energy + 8 + (has('deflect') ? 6 : 0), 0, 100);
        floatText(P.x, FLOOR - 190, '这锅还你', '#8b6fc4', 20);
        beep(620, 0.12, 'triangle', 0.06, 1.4);
        continue;
      }
      if (P.iframe <= 0){
        hitPlayer(s.dmg, s.x);
        game.shots.splice(i, 1);
        continue;
      }
    }

    if (s.life <= 0 || s.x < -40 || s.x > W + 40) game.shots.splice(i, 1);
  }
}

function updateZones(dt){
  for (var i = game.zones.length - 1; i >= 0; i--){
    var z = game.zones[i];
    z.t += dt;

    // 茶水区：持续减速 + 每 0.5 秒小伤害
    if (z.kind === 'tea'){
      z.tick = (z.tick || 0) + dt;
      if (z.tick >= 0.5){
        z.tick = 0;
        for (var t = 0; t < game.enemies.length; t++){
          var te = game.enemies[t];
          if (te.hp <= 0) continue;
          if (Math.abs(te.x - z.x) < z.r) damageEnemy(te, 3, 0, 0.1);
        }
      }
      for (var s2 = 0; s2 < game.enemies.length; s2++){
        var se = game.enemies[s2];
        if (se.hp <= 0) continue;
        if (Math.abs(se.x - z.x) < z.r){ se.slowT = 0.3; se.slowMul = 0.45; }
      }
      if (z.t >= z.dur) game.zones.splice(i, 1);
      continue;
    }

    if (!z.done && z.t >= z.dur){
      z.done = true;
      if (Math.abs(P.x - z.x) < z.r && P.iframe <= 0 && P.slack <= 0) hitPlayer(z.dmg, z.x);
      spark(z.x, FLOOR - 30, 12, '#f0a93a', 260);
      game.shake = Math.max(game.shake, 6);
    }
    if (z.t > z.dur + 0.25) game.zones.splice(i, 1);
  }
}

function updateParticles(dt){
  for (var i = game.parts.length - 1; i >= 0; i--){
    var p = game.parts[i];
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 900 * dt;
    if (p.life <= 0) game.parts.splice(i, 1);
  }
  for (var j = game.texts.length - 1; j >= 0; j--){
    var t = game.texts[j];
    t.life -= dt; t.y += t.vy * dt; t.vy *= 0.94;
    if (t.life <= 0) game.texts.splice(j, 1);
  }
  for (var k = game.fx.length - 1; k >= 0; k--){
    var f = game.fx[k];
    f.t += dt;
    if (f.t >= f.life) game.fx.splice(k, 1);
  }
}

function drawClock(cx, cy){
  ctx.save();
  ctx.fillStyle = 'rgba(160,195,225,.16)';
  ctx.beginPath(); ctx.arc(cx + 3, cy + 4, 33, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(cx, cy, 31, 0, 7); ctx.fill();
  ctx.strokeStyle = '#b6d3e8'; ctx.lineWidth = 4; ctx.stroke();
  // 刻度
  ctx.strokeStyle = '#d3e4f2'; ctx.lineWidth = 2;
  for (var k = 0; k < 12; k++){
    var a = k / 12 * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * 27, cy + Math.sin(a) * 27);
    ctx.lineTo(cx + Math.cos(a) * 30, cy + Math.sin(a) * 30);
    ctx.stroke();
  }
  var t = clamp(game.time / 60, 0, 1);
  ctx.strokeStyle = '#2f7fd0'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(-Math.PI / 2 + t * 6.28) * 19, cy + Math.sin(-Math.PI / 2 + t * 6.28) * 19);
  ctx.stroke();
  ctx.strokeStyle = '#8fb6d8'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - 25); ctx.stroke();
  ctx.fillStyle = '#5b7086'; ctx.font = '600 11px system-ui,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('18:00', cx, cy + 52);
  ctx.restore();
}

/* =============== 绘制：火柴人 =============== */
function seg(x, y, a, l){ return [x + Math.sin(a) * l, y + Math.cos(a) * l]; }

function poseOf(e){
  var t = e.animT || 0;
  var la = 0.14, lb = -0.14, aa = 0.32, ab = -0.3, lean = 0;
  if (e.state === 'walk' || e.moving){
    var s = Math.sin(t * 11);
    la = s * 0.52; lb = -s * 0.52;
    aa = -s * 0.34; ab = s * 0.34;
    lean = 0.06;
  } else {
    var b = Math.sin(t * 2.6) * 0.03;
    lean = b;
  }
  if (e.state === 'windup'){ lean = -0.16; aa = 2.35; ab = -0.5; }
  if (e.state === 'attack'){ lean = 0.18; aa = 1.5; ab = -0.55; }
  if (e.state === 'act'){ lean = 0.12; aa = -0.9; ab = 0.4; }
  if (e.state === 'dodge'){ lean = 0.5; la = 0.55; lb = -0.5; aa = 0.9; ab = -0.3; }
  if (e.state === 'hurt' || (e.hurtT && e.hurtT > 0)){ lean = -0.34; aa = -0.6; ab = -0.9; }
  if (e.stun && e.stun > 0){ lean = 0.22; aa = 0.22; ab = -0.22; }
  if (e.state === 'heavy' && e.phase === 0){ lean = -0.2; aa = 2.7; ab = -0.6; }
  if (e.state === 'heavy' && e.phase >= 1){ lean = 0.32; aa = 1.1; ab = -0.7; }
  if (e.state === 'attack' && e.phase === 0){ lean = -0.1; aa = 2.1; ab = -0.4; }
  return { la: la, lb: lb, aa: aa, ab: ab, lean: lean };
}

function drawShadow(x, s){
  ctx.save();
  ctx.fillStyle = 'rgba(90,130,170,.13)';
