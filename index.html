  ctx.restore();
}

/* 颜色工具：amt>0 提亮，amt<0 压暗 */
function shade(hex, amt){
  var c = String(hex || '#26374a').replace('#', '');
  if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
  var r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  if (isNaN(r) || isNaN(g) || isNaN(b)) { r = 38; g = 55; b = 74; }
  if (amt >= 0){ r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  else { r *= (1 + amt); g *= (1 + amt); b *= (1 + amt); }
  return 'rgb(' + Math.round(r) + ',' + Math.round(g) + ',' + Math.round(b) + ')';
}

/* 颜色混合 t: 0->c1, 1->c2 */
function mixColor(c1, c2, t){
  function parse(c){
    c = String(c).replace('#', '');
    if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
    if (c.indexOf('rgb') === 0){
      var m = c.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
      return m ? [+m[1], +m[2], +m[3]] : [200, 210, 220];
    }
    return [parseInt(c.substr(0, 2), 16) || 0, parseInt(c.substr(2, 2), 16) || 0, parseInt(c.substr(4, 2), 16) || 0];
  }
  var a = parse(c1), b = parse(c2);
  return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')';
}

/* Q 版头发：不同岗位/敌人不同发型 */
function drawHair(x, y, r, style, color){
  ctx.save();
  if (style === 'phones'){
    ctx.strokeStyle = '#93a9be'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(x, y - 2, r + 3, Math.PI * 1.06, Math.PI * 1.94); ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y - 1, r + 1, Math.PI * 1.0, Math.PI * 2.0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#a98be0';
    ctx.beginPath(); ctx.roundRect(x - r - 7, y - 5, 9, 17, 4.5); ctx.fill();
    ctx.beginPath(); ctx.roundRect(x + r - 2, y - 5, 9, 17, 4.5); ctx.fill();
    ctx.restore(); return;
  }
  if (style === 'bald'){
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.beginPath(); ctx.ellipse(x - r * 0.34, y - r * 0.6, 7, 4.5, -0.5, 0, 7); ctx.fill();
    ctx.restore(); return;
  }
  // 基础头发（上半圆）
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(x, y - 1, r + 1.5, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();

  if (style === 'spiky'){
    ctx.beginPath();
    ctx.moveTo(x - r * 0.7, y - r * 0.72); ctx.lineTo(x - r * 0.45, y - r * 1.5); ctx.lineTo(x - r * 0.2, y - r * 0.86);
    ctx.moveTo(x - r * 0.1, y - r * 0.92); ctx.lineTo(x + r * 0.16, y - r * 1.62); ctx.lineTo(x + r * 0.4, y - r * 0.86);
    ctx.fill();
  } else if (style === 'messy'){
    ctx.beginPath();
    ctx.moveTo(x + r * 0.1, y - r * 0.9); ctx.lineTo(x + r * 0.5, y - r * 1.36); ctx.lineTo(x + r * 0.62, y - r * 0.78);
    ctx.moveTo(x - r * 0.62, y - r * 0.74); ctx.lineTo(x - r * 0.28, y - r * 1.28); ctx.lineTo(x - r * 0.05, y - r * 0.84);
    ctx.fill();
  } else if (style === 'long'){
    ctx.beginPath();
    ctx.moveTo(x - r * 1.02, y - r * 0.2);
    ctx.quadraticCurveTo(x - r * 1.24, y + r * 0.75, x - r * 0.78, y + r * 0.92);
    ctx.quadraticCurveTo(x - r * 0.9, y + r * 0.2, x - r * 0.72, y - r * 0.3);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + r * 1.02, y - r * 0.2);
    ctx.quadraticCurveTo(x + r * 1.24, y + r * 0.75, x + r * 0.78, y + r * 0.92);
    ctx.quadraticCurveTo(x + r * 0.9, y + r * 0.2, x + r * 0.72, y - r * 0.3);
    ctx.closePath(); ctx.fill();
  } else if (style === 'bun'){
    ctx.beginPath(); ctx.arc(x - r * 0.86, y - r * 0.72, r * 0.34, 0, 7); ctx.fill();
  } else if (style === 'bowl'){
    // 齐刘海
    ctx.beginPath(); ctx.rect(x - r * 0.92, y - r * 0.55, r * 1.84, r * 0.34); ctx.fill();
  }
  ctx.restore();
}

function drawStick(e){
  var s = e.scale || 1;
  var p = poseOf(e);
  var ui = (e.uid === undefined) ? -1 : e.uid;
  var hurt = !!(e.hurtT && e.hurtT > 0);
  var boss = !!e.isBoss;

  var base = hurt ? '#d9705f' : (e.color || '#26374a');
  var shirt = hurt ? '#eba294' : (boss ? '#46596e' : shade(base, 0.42));
  if (!hurt && !boss && !e.isPlayer && e.accent){
    shirt = mixColor(shade(base, 0.5), e.accent, 0.16);
  }
  var pants = hurt ? '#d4816f' : (boss ? '#2f3f52' : shade(base, 0.02));
  var skin = hurt ? '#f6c9bd' : '#fff3e4';
  var hairColor = hurt ? '#c9796a' : (e.hair || shade(base, -0.7));
  var style = e.hairStyle || (boss ? 'bald' : (e.kind === 'req' ? 'spiky' : (e.kind === 'pot' ? 'flat' : (e.kind === 'dog' ? 'phones' : (e.kind === 'hr' ? 'long' : (e.kind === 'sec' ? 'flat' : 'bowl'))))));

  // Q 版比例：大头、短身、短腿
  var hipY = -54, neckY = -92;
  var neckX = p.lean * 20;
  var headR = boss ? 25 : 23;
  var headX = neckX + p.lean * 5, headY = neckY - headR + 4;

  ctx.save();
  ctx.translate(e.x, FLOOR - (e.hop || 0));
  ctx.scale(e.facing * s, s);
  if (P.slack > 0 && ui === -1) ctx.globalAlpha = 0.45;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // ---- 腿 ----
  var kneeA = seg(0, hipY, p.la, 26);
  var footA = seg(kneeA[0], kneeA[1], p.la * 0.32, 26);
  var kneeB = seg(0, hipY, p.lb, 26);
  var footB = seg(kneeB[0], kneeB[1], p.lb * 0.32, 26);
  ctx.strokeStyle = pants; ctx.lineWidth = 11;
  ctx.beginPath();
  ctx.moveTo(0, hipY); ctx.lineTo(kneeA[0], kneeA[1]);
  ctx.moveTo(0, hipY); ctx.lineTo(kneeB[0], kneeB[1]);
  ctx.stroke();
  ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(kneeA[0], kneeA[1]); ctx.lineTo(footA[0], footA[1]);
  ctx.moveTo(kneeB[0], kneeB[1]); ctx.lineTo(footB[0], footB[1]);
  ctx.stroke();
  // 皮鞋
  ctx.fillStyle = shade(base, -0.55);
  ctx.beginPath(); ctx.ellipse(footA[0] + 3, footA[1] + 1, 10, 5.5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(footB[0] + 3, footB[1] + 1, 10, 5.5, 0, 0, 7); ctx.fill();

  // ---- 躯干（衬衫） ----
  ctx.beginPath();
  ctx.moveTo(neckX - 13, neckY + 5);
  ctx.quadraticCurveTo(neckX - 17, (neckY + hipY) / 2, -11, hipY - 1);
  ctx.lineTo(11, hipY - 1);
  ctx.quadraticCurveTo(neckX + 17, (neckY + hipY) / 2, neckX + 13, neckY + 5);
  ctx.closePath();
  ctx.fillStyle = shirt; ctx.fill();
  ctx.strokeStyle = shade(base, -0.42); ctx.lineWidth = 2.6; ctx.stroke();

  // Boss 西装领口
  if (boss){
    ctx.fillStyle = '#f7fbff';
    ctx.beginPath();
    ctx.moveTo(neckX - 8, neckY + 4); ctx.lineTo(neckX, neckY + 18); ctx.lineTo(neckX + 8, neckY + 4);
    ctx.closePath(); ctx.fill();
  }

  // ---- 岗位服装特征（剪影级：远看就能分出谁是谁）----
  if (e.outfit === 'backpack'){
    // 实习生：双肩包背带
    ctx.strokeStyle = shade(base, -0.34); ctx.lineWidth = 4.2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(neckX - 9, neckY + 5); ctx.lineTo(-9, hipY + 2);
    ctx.moveTo(neckX + 9, neckY + 5); ctx.lineTo(9, hipY + 2);
    ctx.stroke();
    ctx.fillStyle = '#f2c14e'; ctx.fillRect(-7, neckY + 10, 6, 4);
  } else if (e.outfit === 'hoodie'){
    // 程序员：连帽衫帽兜 + 抽绳
    ctx.fillStyle = shade(base, 0.28);
    ctx.beginPath(); ctx.ellipse(neckX, neckY + 9, 15, 9, 0, Math.PI, 0); ctx.fill();
    ctx.strokeStyle = '#eef3f8'; ctx.lineWidth = 1.9; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(neckX - 4.5, neckY + 12); ctx.lineTo(neckX - 4.5, neckY + 25);
    ctx.moveTo(neckX + 4.5, neckY + 12); ctx.lineTo(neckX + 4.5, neckY + 25);
    ctx.stroke();
  } else if (e.outfit === 'sling'){
    // 销售：斜挎包带
    ctx.strokeStyle = shade(base, -0.46); ctx.lineWidth = 5.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(neckX + 10, neckY + 4); ctx.lineTo(-8, hipY - 1); ctx.stroke();
    ctx.fillStyle = '#c08a12';
    ctx.beginPath(); ctx.roundRect(-12, hipY - 10, 9, 7, 2); ctx.fill();
  }

  // ---- 手臂 ----
  var elA = seg(neckX, neckY + 8, p.aa, 18);
  var hdA = seg(elA[0], elA[1], p.aa + 0.2, 18);
  var elB = seg(neckX, neckY + 8, p.ab, 18);
  var hdB = seg(elB[0], elB[1], p.ab + 0.2, 18);
  ctx.strokeStyle = shirt; ctx.lineWidth = 9;
  ctx.beginPath();
  ctx.moveTo(neckX, neckY + 6); ctx.lineTo(elA[0], elA[1]); ctx.lineTo(hdA[0], hdA[1]);
  ctx.moveTo(neckX, neckY + 6); ctx.lineTo(elB[0], elB[1]); ctx.lineTo(hdB[0], hdB[1]);
  ctx.stroke();
  // 财务：白套袖
  if (e.outfit === 'sleeves'){
    ctx.strokeStyle = '#f2f7fb'; ctx.lineWidth = 10.4; ctx.lineCap = 'butt';
    ctx.beginPath();
    ctx.moveTo(elA[0] + (hdA[0] - elA[0]) * 0.02, elA[1] + (hdA[1] - elA[1]) * 0.02);
    ctx.lineTo(elA[0] + (hdA[0] - elA[0]) * 0.84, elA[1] + (hdA[1] - elA[1]) * 0.84);
    ctx.moveTo(elB[0] + (hdB[0] - elB[0]) * 0.02, elB[1] + (hdB[1] - elB[1]) * 0.02);
    ctx.lineTo(elB[0] + (hdB[0] - elB[0]) * 0.84, elB[1] + (hdB[1] - elB[1]) * 0.84);
    ctx.stroke();
    ctx.lineCap = 'round';
  }
  // 手
  ctx.fillStyle = skin; ctx.strokeStyle = shade(base, -0.4); ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(hdA[0], hdA[1], 4.8, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(hdB[0], hdB[1], 4.8, 0, 7); ctx.fill(); ctx.stroke();

  // ---- 头 ----
  ctx.beginPath(); ctx.arc(headX, headY, headR, 0, 7);
  ctx.fillStyle = skin; ctx.fill();
  ctx.strokeStyle = shade(base, -0.45); ctx.lineWidth = 3; ctx.stroke();
  drawHair(headX, headY, headR, style, hairColor);

  // 眼睛（会眨）
  var blink = (Math.sin((e.animT || 0) * 1.6) > 0.992) ? 0.18 : 1;
  ctx.fillStyle = '#2b3948';
  ctx.beginPath(); ctx.ellipse(headX + headR * 0.26, headY + 2, 2.7, 3.6 * blink, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(headX + headR * 0.68, headY + 2, 2.7, 3.6 * blink, 0, 0, 7); ctx.fill();
  if (blink > 0.5){
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(headX + headR * 0.26 + 1, headY + 0.5, 1, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(headX + headR * 0.68 + 1, headY + 0.5, 1, 0, 7); ctx.fill();
  }
  // 腮红
  ctx.fillStyle = 'rgba(255,146,132,.42)';
  ctx.beginPath(); ctx.ellipse(headX + headR * 0.1, headY + 11, 4.4, 2.6, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(headX + headR * 0.84, headY + 11, 4.4, 2.6, 0, 0, 7); ctx.fill();
  // 嘴
  ctx.strokeStyle = '#9c6a58'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  if (hurt || (e.hp !== undefined && e.hp <= 0)) ctx.arc(headX + headR * 0.5, headY + 14, 2.6, Math.PI + 0.2, -0.2);
  else ctx.arc(headX + headR * 0.5, headY + 10, 3, 0.15, Math.PI - 0.15);
  ctx.stroke();

  // ---- 配饰 ----
  // 领带
  if (e.tie || e.isPlayer){
    ctx.fillStyle = e.tie || '#2f7fd0';
    ctx.beginPath();
    ctx.moveTo(neckX - 3, neckY + 3);
    ctx.lineTo(neckX + 4, neckY + 3);
    ctx.lineTo(neckX + 2, neckY + 15);
    ctx.lineTo(neckX - 1, neckY + 15);
    ctx.closePath(); ctx.fill();
  }
  // 玩家工牌（挂绳用英雄主题色）
  if (e.isPlayer && !e.accent){
    ctx.strokeStyle = e.tie || '#2f7fd0'; ctx.lineWidth = 3.2;
    ctx.beginPath();
    ctx.moveTo(neckX - 8, neckY + 4); ctx.lineTo(neckX + 8, neckY + 8);
    ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = e.tie || '#2f7fd0'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.roundRect(neckX + 1, neckY + 9, 10, 12, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = e.tie || '#2f7fd0'; ctx.fillRect(neckX + 3, neckY + 11, 6, 2.2);
  }
  // 工牌（敌方识别色）
  if (e.accent){
    ctx.strokeStyle = e.accent; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(neckX - 9, neckY + 4); ctx.lineTo(neckX + 9, neckY + 8);
    ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = e.accent; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.roundRect(neckX + 1, neckY + 9, 10, 12, 2); ctx.fill(); ctx.stroke();
  }
  // 玩家出手：手里拿的就是当前武器（掉落后立刻换外观）
  if (e.isPlayer && (e.state === 'attack' || e.state === 'heavy')){
    var wid = e.weapon || (typeof P !== 'undefined' ? P.weapon : 'notebook') || 'notebook';
    var swing = (e.state === 'heavy')
      ? (e.phase >= 1 ? 0.62 : -0.5)
      : (e.phase >= 1 ? 0.34 : -0.3);
    drawWeaponIcon(wid, hdA[0] + 5, hdA[1] - 3, swing, e.state === 'heavy' ? 1.34 : 1.08);
  }
  // 敌人道具
  if (e.kind === 'pot'){
    ctx.fillStyle = '#8b98a6';
    ctx.beginPath(); ctx.ellipse(hdB[0], hdB[1], 10, 6, 0.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#7c8b99';
    ctx.fillRect(hdB[0] + 9, hdB[1] - 1, 9, 3);
  }
  if (e.kind === 'req'){
    ctx.fillStyle = '#ffe9a8'; ctx.strokeStyle = '#e8cf8a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(hdA[0] - 4, hdA[1] - 7, 12, 14, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e8cf8a'; ctx.fillRect(hdA[0] - 1, hdA[1] - 4, 6, 1.5);
  }
  if (e.isBoss){
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#c7d8e6'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(hdA[0], hdA[1] - 6, 11, 12, 3); ctx.fill(); ctx.stroke();
  }

  // ---- 举盾（保安 / Boss）----
  if (e.guardT > 0){
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.2 * Math.sin((e.animT || 0) * 12);
    ctx.strokeStyle = '#3f9b7a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(headX + headR * 0.5, neckY + 16, 34, -1.15, 1.15); ctx.stroke();
    ctx.fillStyle = 'rgba(63,155,122,.16)';
    ctx.beginPath(); ctx.arc(headX + headR * 0.5, neckY + 16, 34, -1.15, 1.15); ctx.fill();
    ctx.restore();
  }

  // ---- 岗位特征：一眼认出这是谁 ----
  if (e.acc === 'glasses'){
    ctx.save();
    var gy = headY + 2;
    ctx.strokeStyle = '#33445a'; ctx.lineWidth = 1.8;
    ctx.fillStyle = 'rgba(186,222,244,.42)';
    ctx.beginPath(); ctx.arc(headX + headR * 0.26, gy, 6.6, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(headX + headR * 0.68, gy, 6.6, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(headX + headR * 0.26 + 6.6, gy); ctx.lineTo(headX + headR * 0.68 - 6.6, gy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(headX - headR * 0.55, gy - 2); ctx.lineTo(headX + headR * 0.26 - 6.6, gy); ctx.stroke();
    ctx.restore();
  }
  if (e.phones){
    // 耳机：横跨头顶 + 两侧耳罩
    ctx.save();
    ctx.strokeStyle = '#4d6074'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(headX, headY + 1, headR + 4.5, Math.PI * 1.06, Math.PI * 1.94); ctx.stroke();
    ctx.fillStyle = '#5b7086';
    ctx.beginPath(); ctx.roundRect(headX - headR - 8.5, headY - 2, 7.5, 13, 3.4); ctx.fill();
    ctx.beginPath(); ctx.roundRect(headX + headR + 1, headY - 2, 7.5, 13, 3.4); ctx.fill();
    ctx.restore();
  }
  if (e.prop === 'folder'){
    // 实习生：抱着一摞资料
    ctx.save();
    ctx.translate(hdA[0] + 1, hdA[1] + 3); ctx.rotate(-0.16); ctx.scale(1.22, 1.22);
    ctx.fillStyle = '#eef6fd'; ctx.strokeStyle = '#9db9d1'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.roundRect(-12, -11, 24, 21, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#f3c04a'; ctx.fillRect(-12, -11, 6, 9);
    ctx.fillStyle = '#cfe2f2';
    ctx.fillRect(-4, -6, 14, 2.4); ctx.fillRect(-4, -1.4, 11, 2.4);
    ctx.restore();
  } else if (e.prop === 'laptop'){
    // 程序员：抱着笔记本，屏幕还亮着
    ctx.save();
    ctx.translate(hdA[0] + 2, hdA[1] + 4); ctx.rotate(-0.12); ctx.scale(1.28, 1.28);
    ctx.fillStyle = '#b9c9d8'; ctx.strokeStyle = '#8497a9'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.roundRect(-11, -4, 22, 9, 2); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-11, -4); ctx.lineTo(-8, -17); ctx.lineTo(9, -17); ctx.lineTo(11, -4); ctx.closePath();
    ctx.fillStyle = '#e8f2fa'; ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(47,163,107,.75)';
    ctx.fillRect(-6, -14, 10, 1.9); ctx.fillRect(-6, -10.6, 7, 1.9);
    ctx.restore();
  } else if (e.prop === 'phone'){
    // 销售：一手举着手机
    ctx.save();
    ctx.translate(hdB[0] + 3, hdB[1] - 6); ctx.rotate(0.2); ctx.scale(1.3, 1.3);
    ctx.fillStyle = '#2b3948';
    ctx.beginPath(); ctx.roundRect(-5, -9.5, 10, 19, 2.6); ctx.fill();
    ctx.fillStyle = '#9fd8f5'; ctx.fillRect(-3.6, -7, 7.2, 12.4);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(-3.6, -7, 7.2, 3);
    ctx.restore();
  } else if (e.prop === 'calc'){
    // 财务：手里一个计算器
    ctx.save();
    ctx.translate(hdB[0] - 1, hdB[1] + 2); ctx.rotate(0.14); ctx.scale(1.25, 1.25);
    ctx.fillStyle = '#e8eef4'; ctx.strokeStyle = '#9aa9b8'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.roundRect(-8, -11.5, 17, 23, 2.6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#cfe0ee'; ctx.fillRect(-5.2, -8.6, 11, 5);
    ctx.fillStyle = '#7c8b99';
    for (var cr = 0; cr < 3; cr++) for (var cc = 0; cc < 3; cc++) ctx.fillRect(-5.2 + cc * 4.1, -1.2 + cr * 4, 2.6, 2.6);
    ctx.restore();
  }
  ctx.restore();

  if (e.affix){
    ctx.save();
    ctx.globalAlpha = 0.55; ctx.strokeStyle = e.accent; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(e.x, FLOOR + 4, 30 * e.scale, 9 * e.scale, 0, 0, 7); ctx.stroke();
    ctx.restore();
  }

  // 名字与出招预警
  if (!e.isPlayer && e.hp > 0){
    ctx.save();
    ctx.textAlign = 'center';
    var warning = (e.state === 'windup' || (e.state === 'act' && e.act && e.act.phase === 'windup'));
    if (warning){
      ctx.fillStyle = '#e05252'; ctx.font = '700 22px system-ui,sans-serif';
      ctx.fillText('!', e.x, FLOOR - 182 * e.scale);
    } else if (e.isBoss){
      // Boss 名字由 HUD 血条显示，画布上不重复
    } else {
      ctx.font = '500 11px system-ui,sans-serif';
      var nw = ctx.measureText(e.name).width;
      ctx.fillStyle = 'rgba(255,255,255,.74)';
      ctx.beginPath();
      ctx.roundRect(e.x - nw / 2 - 6, FLOOR - 176 * e.scale - 9, nw + 12, 15, 7.5);
      ctx.fill();
      ctx.fillStyle = '#6b7f95';
      ctx.fillText(e.name, e.x, FLOOR - 176 * e.scale);
    }
    ctx.restore();
  }

  // 眩晕星
  if ((e.stun && e.stun > 0) || e.state === 'stun'){
    ctx.save();
    ctx.fillStyle = '#f0a93a';
    for (var i = 0; i < 3; i++){
      var a = e.animT * 4 + i * 2.1;
      ctx.beginPath();
      ctx.arc(e.x + Math.cos(a) * 16, FLOOR - 150 * e.scale + Math.sin(a) * 6, 3, 0, 7);
      ctx.fill();
    }
    ctx.restore();
  }
  // 敌人血条
  if (!e.isPlayer && e.hp > 0 && e.hp < e.maxhp && !e.isBoss){
    var bw = 46 * e.scale, bh = 4;
    var by = FLOOR - 158 * e.scale;
    ctx.fillStyle = 'rgba(150,175,200,.35)';
    ctx.fillRect(e.x - bw / 2, by, bw, bh);
    ctx.fillStyle = '#e05252';
    ctx.fillRect(e.x - bw / 2, by, bw * (e.hp / e.maxhp), bh);
  }
}

function drawPlayer(){
  var e = {
    x: P.x, facing: P.facing, scale: P.scale, color: HERO.color,
    state: P.state, animT: P.animT, phase: P.phase, isPlayer: true,
    hurtT: P.hurtT, stun: 0, hp: 1, maxhp: 1, seg: 2, tie: HERO.tie,
    hairStyle: HERO.hs, hair: HERO.hair,
    prop: HERO.prop, acc: HERO.acc, phones: HERO.phones, outfit: HERO.outfit, weapon: P.weapon
  };
  if (P.iframe > 0 && P.state !== 'dodge' && Math.floor(game.time * 24) % 2 === 0){
    ctx.globalAlpha = 0.55;
  }
  drawShadow(P.x, P.scale);
  drawStick(e);
  ctx.globalAlpha = 1;
  if (P.shield > 0){
    ctx.save();
    ctx.globalAlpha = 0.28 + 0.12 * Math.sin(game.time * 6);
    ctx.strokeStyle = '#2f7fd0'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(P.x, FLOOR - 72, 52, 0, 7); ctx.stroke();
    ctx.restore();
  }
  if (P.slack > 0){
    ctx.fillStyle = '#5b7086'; ctx.font = '600 13px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('假装很忙…', P.x, FLOOR - 175);
    ctx.fillStyle = '#dbe9f4'; ctx.fillRect(P.x + 22, FLOOR - 110, 12, 18);
  }
  if (P.buffT > 0){
    ctx.fillStyle = '#2fa36b'; ctx.font = '600 12px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('攻速↑', P.x, FLOOR - 196);
  }
  if (P.dmgT > 0){
    ctx.fillStyle = '#c08a12'; ctx.font = '600 12px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('伤害↑', P.x + 44, FLOOR - 196);
  }
}

/* =============== 绘制：特效 =============== */
function drawZones(){
  for (var i = 0; i < game.zones.length; i++){
    var z = game.zones[i];
    var k = clamp(z.t / z.dur, 0, 1);
    ctx.save();
    ctx.globalAlpha = z.kind === 'tea' ? (0.14 + 0.08 * Math.sin(game.time * 4)) : (0.16 + k * 0.22);
    ctx.fillStyle = z.kind === 'paper' ? '#b45309' : (z.kind === 'beam' ? '#a83232' : (z.kind === 'tea' ? '#c08a12' : '#7c3aed'));
    ctx.beginPath(); ctx.ellipse(z.x, FLOOR + 2, z.r, z.r * 0.26, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 0.5 + k * 0.4;
    ctx.strokeStyle = ctx.fillStyle;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(z.x, FLOOR + 2, z.r * (0.4 + k * 0.6), z.r * 0.26 * (0.4 + k * 0.6), 0, 0, 7); ctx.stroke();
    ctx.restore();
  }
}

function drawShots(){
  for (var i = 0; i < game.shots.length; i++){
    var s = game.shots[i];
    if (s.friendly){
      ctx.save(); ctx.translate(s.x, s.y);
      ctx.fillStyle = 'rgba(139,111,196,.22)';
      ctx.beginPath(); ctx.arc(0, 0, (s.r || 10) + 10, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(139,111,196,.5)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.translate(s.x, s.y);
    if (s.kind === 'pan'){
      ctx.fillStyle = '#8b98a6';
      ctx.beginPath(); ctx.ellipse(0, 0, 15, 8, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = '#6d7c8a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(-22, 0); ctx.stroke();
    } else {
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#c7d8e6'; ctx.lineWidth = 2;
      ctx.rotate(-0.2);
      ctx.beginPath(); ctx.roundRect(-14, -9, 28, 18, 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#dbe9f4';
      ctx.fillRect(-10, -5, 20, 2); ctx.fillRect(-10, 0, 14, 2);
    }
    ctx.restore();
  }
}

function drawParticles(){
  for (var i = 0; i < game.parts.length; i++){
    var p = game.parts[i];
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (var k = 0; k < game.fx.length; k++){
    var f = game.fx[k];
    var t = f.t / f.life;
    ctx.globalAlpha = 1 - t;
    ctx.strokeStyle = f.color; ctx.lineWidth = 3 * (1 - t) + 1;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * t, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (var j = 0; j < game.texts.length; j++){
    var tx = game.texts[j];
    ctx.globalAlpha = clamp(tx.life / tx.max, 0, 1);
    ctx.fillStyle = tx.color;
    ctx.font = '700 ' + tx.size + 'px system-ui,-apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(tx.txt, tx.x, tx.y);
  }
  ctx.globalAlpha = 1;
}

function drawBanner(){
  if (game.bannerT <= 0 || !game.banner) return;
  var a = clamp(game.bannerT / 0.45, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  ctx.font = '700 30px system-ui,-apple-system,sans-serif';
  var tw = ctx.measureText(game.banner.title).width;
  var pw = Math.max(tw + 96, 300), ph = 84;
  var bx = W / 2 - pw / 2, by = 116;
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.strokeStyle = '#d7e5f2'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(bx, by, pw, ph, 14); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#22303f';
  ctx.fillText(game.banner.title, W / 2, by + 36);
  ctx.fillStyle = '#5b7086';
  ctx.font = '400 15px system-ui,-apple-system,sans-serif';
  ctx.fillText(game.banner.sub, W / 2, by + 64);
  ctx.restore();
}

function render(){
  ctx.save();
  if (game.shake > 0.1){
    ctx.translate(rnd(-game.shake, game.shake) * 0.6, rnd(-game.shake, game.shake) * 0.6);
  }
  drawBG();
  drawZones();
  drawDrops();
  for (var i = 0; i < game.enemies.length; i++){
    var e = game.enemies[i];
    if (e.hp <= 0){
      ctx.globalAlpha = clamp(1 - e.deadT / 0.55, 0, 1);
      drawStick(e);
      ctx.globalAlpha = 1;
      continue;
    }
    drawShadow(e.x, e.scale);
    drawStick(e);
    if (e.froze){
      ctx.save();
      ctx.globalAlpha = 0.3; ctx.fillStyle = '#7fc4f5';
      ctx.beginPath(); ctx.ellipse(e.x, FLOOR - 60 * e.scale, 30 * e.scale, 60 * e.scale, 0, 0, 7); ctx.fill();
      ctx.restore();
    }
    if (e.markT > 0){
      ctx.fillStyle = '#c08a12'; ctx.font = '700 13px system-ui,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('审', e.x, FLOOR - 150 * e.scale);
    }
  }
  drawAllies();
  drawPlayer();
  drawShots();
  drawParticles();
  drawBanner();
  ctx.restore();
  if (game.slowT > 0){
    ctx.save();
    ctx.fillStyle = 'rgba(47,127,208,.10)';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  drawArena();
  drawLowHp();
  drawUltFx();
}

/* 场地状态：顶部横幅 + 屏幕着色 + 断电时的黑暗 */
function drawArena(){
  var a = game.arena;
  if (game.dark > 0){
    ctx.save();
    var g = ctx.createRadialGradient(P.x, FLOOR - 80, 40, P.x, FLOOR - 80, 300);
    g.addColorStop(0, 'rgba(8,16,28,0)');
    g.addColorStop(0.55, 'rgba(8,16,28,' + (0.42 * game.dark).toFixed(2) + ')');
    g.addColorStop(1, 'rgba(6,12,22,' + (0.78 * game.dark).toFixed(2) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  if (!a) return;
  var k = Math.min(1, a.t / 0.8);
  ctx.save();
  ctx.globalAlpha = 0.10 * k;
  ctx.fillStyle = a.color; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/* 低血量：红色边缘渐晕 + 边框脉冲 + 提示 */
function drawLowHp(){
  if (game.state !== 'play') return;
  var r = P.hp / P.maxhp;
  if (P.hp <= 0 || r > 0.28) return;
  var k = 1 - r / 0.28;
  var pulse = 0.5 + 0.5 * Math.sin(game.time * 6.2);
  ctx.save();
  var g = ctx.createRadialGradient(W / 2, H / 2, H * 0.24, W / 2, H / 2, H * 0.92);
  g.addColorStop(0, 'rgba(198,48,48,0)');
  g.addColorStop(1, 'rgba(198,48,48,' + ((0.12 + 0.3 * k) * (0.55 + 0.45 * pulse)).toFixed(3) + ')');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(206,58,58,' + ((0.30 + 0.42 * k) * (0.55 + 0.45 * pulse)).toFixed(3) + ')';
  ctx.lineWidth = 7;
  ctx.strokeRect(3.5, 3.5, W - 7, H - 7);
  ctx.globalAlpha = 0.55 + 0.45 * pulse;
  ctx.textAlign = 'center';
  ctx.font = '700 18px system-ui,sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.fillText('工时告急 · 再不跑就来不及了', W / 2, 107);
  ctx.fillStyle = '#c93b3b';
  ctx.fillText('工时告急 · 再不跑就来不及了', W / 2, 105);
  ctx.globalAlpha = 1;
  ctx.restore();
}

function rgbaOf(c, a){
  var str = String(c);
  if (str.indexOf('rgb') === 0){
    return str.replace('rgb(', 'rgba(').replace(')', ',' + a + ')');
  }
  var h = str.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  return 'rgba(' + (parseInt(h.substr(0, 2), 16) || 0) + ',' + (parseInt(h.substr(2, 2), 16) || 0) + ',' + (parseInt(h.substr(4, 2), 16) || 0) + ',' + a + ')';
}

/* 觉醒：全屏白闪 + 放射冲击 + 技能名 */
function drawUltFx(){
  if (!(game.ultT > 0) || !(game.ultMax > 0)) return;
  var t = 1 - game.ultT / game.ultMax;
  var col = game.ultColor || '#2f7fd0';
  var cx = W / 2, cy = FLOOR - 120;
  ctx.save();
  // 白闪
  if (t < 0.2){
    ctx.globalAlpha = (1 - t / 0.2) * 0.75;
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  // 色晕
  var g = ctx.createRadialGradient(cx, cy, 20, cx, cy, 560);
  g.addColorStop(0, rgbaOf(col, Math.max(0, 0.34 * (1 - t * 1.6))));
  g.addColorStop(1, rgbaOf(col, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 放射线
  ctx.globalAlpha = Math.max(0, 1 - t * 1.7);
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  for (var i = 0; i < 18; i++){
    var a = i / 18 * Math.PI * 2 + t * 1.1;
    var r0 = 60 + t * 520, r1 = r0 + 150;
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * 0.55);
    ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1 * 0.55);
    ctx.stroke();
  }
  // 冲击圆环
  for (var k = 0; k < 2; k++){
    var tt = t - k * 0.16;
    if (tt <= 0) continue;
    var rr = tt * 980;
    ctx.globalAlpha = Math.max(0, 0.6 - tt * 0.75);
    ctx.strokeStyle = col; ctx.lineWidth = 11 - k * 5;
    ctx.beginPath(); ctx.ellipse(cx, cy, rr, rr * 0.42, 0, 0, 7); ctx.stroke();
  }
  // 技能名
  var fade = Math.min(1, t / 0.2) * Math.max(0, 1 - Math.max(0, t - 0.52) / 0.48);
  if (fade > 0.01){
    ctx.globalAlpha = fade;
    ctx.textAlign = 'center';
    var size = 34 + (1 - Math.min(1, t / 0.24)) * 30;
    ctx.font = '800 ' + size.toFixed(0) + 'px system-ui,-apple-system,sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.strokeText(game.ultName, W / 2, H * 0.44);
    ctx.fillStyle = col;
    ctx.fillText(game.ultName, W / 2, H * 0.44);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function ultFx(color, name){
  game.ultT = 0.95; game.ultMax = 0.95;
  game.ultColor = color; game.ultName = name;
}

/* =============== HUD =============== */
var el = {
  hpFill: document.getElementById('hpFill'), hpBar: document.getElementById('hpBar'),
  enFill: document.getElementById('enFill'), comboBox: document.getElementById('comboBox'),
  comboNum: document.getElementById('comboNum'), comboWord: document.getElementById('comboWord'),
  floorName: document.getElementById('floorName'), waveName: document.getElementById('waveName'),
  bossWrap: document.getElementById('bossWrap'), bossName: document.getElementById('bossName'),
  bossFill: document.getElementById('bossFill'), bossPoise: document.getElementById('bossPoise'),
  poiseFill: document.getElementById('poiseFill'), bossPips: document.getElementById('bossPips').children,
  diffTag: document.getElementById('diffTag'),
  arenaTag: document.getElementById('arenaTag'), arenaName: document.getElementById('arenaName'),
  arenaFill: document.getElementById('arenaFill'),
  sw: [null, document.getElementById('sw1'), document.getElementById('sw2'), document.getElementById('sw3'), document.getElementById('sw4')],
  cd: [null, document.getElementById('cd1'), document.getElementById('cd2'), document.getElementById('cd3'), document.getElementById('cd4')],
  sk: document.querySelectorAll('.sk')
};

function syncHUD(){
  el.hpFill.style.width = (P.hp / P.maxhp * 100) + '%';
  el.hpBar.classList.toggle('low', P.hp / P.maxhp < 0.35);
  el.enFill.style.width = P.energy + '%';
  el.comboBox.classList.toggle('on', game.combo >= 2);
  el.comboNum.textContent = game.combo;
  el.comboWord.textContent = comboWord(game.combo);
  var st = STAGES[game.stage] || STAGES[0];
  el.floorName.textContent = st.name;
  el.waveName.textContent = '第 ' + Math.max(1, game.wave + 1) + ' / ' + st.waves.length + ' 波';

  el.diffTag.textContent = D().name;
  var boss = game.bossRef;
  if (boss && boss.hp > 0){
    el.bossWrap.style.display = 'block';
    el.bossName.textContent = boss.name + (boss.broken > 0 ? ' · 力竭' : '');
    el.bossFill.style.width = (boss.hp / boss.maxhp * 100) + '%';
    el.poiseFill.style.width = Math.min(100, boss.poise / boss.poiseMax * 100) + '%';
    el.bossPoise.classList.toggle('full', boss.poise / boss.poiseMax > 0.8);
    el.bossPoise.style.opacity = boss.poise > 0.5 ? 1 : 0;
    for (var pi = 0; pi < 3; pi++) el.bossPips[pi].classList.toggle('on', boss.phase > pi);
    var ar = game.arena;
    if (ar){
      el.arenaTag.style.display = 'block';
      el.arenaName.textContent = ar.name;
      el.arenaName.style.color = ar.color;
      el.arenaFill.style.width = Math.max(0, Math.min(100, ar.t / ar.dur * 100)) + '%';
      el.arenaFill.style.background = ar.color;
    } else {
      el.arenaTag.style.display = 'none';
    }
  } else {
    el.bossWrap.style.display = 'none';
  }

  for (var i = 1; i <= 4; i++){
    var c = (i < 4) ? cds[i - 1] : 0;
    var mx = (HERO.skills[i - 1].cd || 1);
    el.sw[i].style.height = (i < 4 && c > 0) ? (c / mx * 100) + '%' : '0%';
    el.cd[i].textContent = (i < 4 && c > 0) ? Math.ceil(c) + 's' : '';
    var btn = el.sk[i - 1];
    var ready = (i < 4) ? (c <= 0) : (P.energy >= 100 && !game.awakenUsed);
    btn.classList.toggle('ready', ready);
    if (i === 4) btn.classList.toggle('charged', P.energy >= 100 && !game.awakenUsed);
  }
  el.cd[4].textContent = game.awakenUsed ? '本层已用' : (P.energy >= 100 ? '就绪' : Math.floor(P.energy) + '%');
}

function syncSkillLabels(){
  for (var i = 0; i < 4; i++){
    var b = el.sk[i] && el.sk[i].querySelector('b');
    if (b) b.textContent = HERO.skills[i].name;
  }
}

/* =============== 屏幕 =============== */
var overlay = document.getElementById('overlay');
var panel = document.getElementById('panel');

function hideOverlay(){ overlay.classList.add('hide'); }
function showOverlay(html){ panel.innerHTML = html; overlay.classList.remove('hide'); var b = panel.querySelector('button'); if (b) b.onclick = start; }

function renderChips(){
  var box = document.getElementById('chips');
  if (!box) return;
  var html = '';
  var wp = WEAPONS[P.weapon];
  if (wp) html += '<span class="chip wp">武器 · ' + wp.name + '</span>';
  for (var k in buffs){
    var c = cardById(k);
    if (c) html += '<span class="chip">' + c.name + '</span>';
  }
  box.innerHTML = html;
}

/* 三选一：职场心得 */
var cardPick = null;
function offerCards(after, title){
  game.state = 'card';
  // 已获得的心得不重复出现，避免三选一抽到废牌
  var fresh = CARDS.filter(function(c){ return !buffs[c.id]; });
  var pool = (fresh.length >= 3 ? fresh : CARDS).slice(), picks = [];
  while (picks.length < 3 && pool.length){
    picks.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  var got = [], kk;
  for (kk in buffs){ var cc = cardById(kk); if (cc) got.push(cc.name); }
  var html = '<div class="badge">' + (title || '职场心得') + '</div>' +
    '<h1>三选一</h1><p class="sub">这一局，你想怎么活。<br><b>点卡片或按 1 / 2 / 3</b></p><div class="cards">';
  for (var i = 0; i < picks.length; i++){
    html += '<div class="card" data-i="' + i + '"><span class="tag">' + picks[i].tag +
      '</span><h3>' + picks[i].name + ' <em>' + (i + 1) + '</em></h3><p>' + picks[i].desc + '</p></div>';
  }
  html += '</div><div class="meta">已获得：' + (got.length ? got.join('、') : '无') + '</div>';
  panel.innerHTML = html;
  overlay.classList.remove('hide');

  function choose(idx){
    if (!picks[idx] || game.state !== 'card') return;
    cardPick = null;
    buffs[picks[idx].id] = 1;
    beep(680, 0.12, 'sine', 0.05, 1.3);
    floatText(P.x, FLOOR - 170, picks[idx].name, '#2f7fd0', 22);
    renderChips();
    hideOverlay();
    game.state = 'play';
    after();
  }
  cardPick = choose;
  var nodes = panel.querySelectorAll('.card');
  for (var j = 0; j < nodes.length; j++){
    (function(node){
      node.onclick = function(){ choose(parseInt(node.getAttribute('data-i'), 10)); };
    })(nodes[j]);
  }
}

function showTitle(){
  var rows = '';
  for (var i = 0; i < TALENTS.length; i++){
    var t = TALENTS[i], lv = save.t[t.k];
    var cost = lv < 3 ? t.cost[lv] : -1;
    var label = t.name + ' Lv.' + lv + (cost < 0 ? ' · 满级' : ' · ' + cost + ' 币');
    rows += '<button data-t="' + t.k + '"' + (cost < 0 || save.coins < cost ? ' disabled' : '') + '>' + label + '</button>';
  }
  var hs = '';
  for (var h = 0; h < HEROES.length; h++){
    var H = HEROES[h], names = [];
    for (var si = 0; si < H.skills.length; si++) names.push((si + 1) + H.skills[si].name);
    hs += '<div class="hero' + (HERO.id === H.id ? ' on' : '') + '" data-h="' + h + '">' +
      '<b>' + H.name + '</b><span class="rl">血 ' + H.hp + ' · ' + H.line + ' · ' + (H.kit || '') + '</span>' +
      '<i>' + names.join(' ') + '</i></div>';
  }
  var ds = '';
  for (var di = 0; di < DIFFS.length; di++){
    var df = DIFFS[di];
    ds += '<div class="diff' + (DIFF === di ? ' on' : '') + '" data-d="' + di + '">' +
      '<b>' + df.name + '</b><span>' + df.tag + '<br>血量 ' + Math.round(df.ehp * 100) + '% · 连招 ' +
      df.combo + ' 段</span></div>';
  }
  panel.innerHTML =
    '<div class="badge">火柴人 · 办公室格斗</div>' +
    '<h1>带薪格斗</h1>' +
    '<p class="sub">18:00 到了，你只想下班。<br>但六层楼的人，都想再留你一会儿。</p>' +
    '<div class="heroes">' + hs + '</div>' +
    '<div class="diffs">' + ds + '</div>' +
    '<div class="hint"><b>A/D</b> 移动　<b>J</b> 轻击三连　<b>K</b> 重击 / 残血处决　<b>L</b> 闪避（完美 · 甩锅）　<b>1-4</b> 技能（4 为觉醒）<br>' +
      '<b>打 Boss</b>：连招的最后一击是重击，前两下别硬拼；打满黄条会让 Boss 力竭，这时按 <b>K</b> 结算面谈</div>' +
    '<div class="meta">摸鱼币 <b>' + save.coins + '</b>　最高分 <b>' + save.best + '</b>　通关 <b>' + save.wins + '</b> 次</div>' +
    '<div class="talent">' + rows + '</div>' +
    '<button id="startBtn">和 ' + HERO.name.split(' · ')[1] + ' 一起下班（Enter）</button>';
  overlay.classList.remove('hide');

  var sb = document.getElementById('startBtn');
  if (sb) sb.onclick = start;

  var dbs = panel.querySelectorAll('[data-d]');
  for (var di2 = 0; di2 < dbs.length; di2++){
    (function(node){
      node.onclick = function(){
        var idx = parseInt(node.getAttribute('data-d'), 10);
        if (!DIFFS[idx]) return;
        DIFF = idx; save.diff = idx; writeSave();
        beep(660, 0.07, 'square', 0.035, 1.3);
        showTitle();
      };
    })(dbs[di2]);
  }

  var hbs = panel.querySelectorAll('[data-h]');
  for (var q = 0; q < hbs.length; q++){
    (function(node){
      node.onclick = function(){
        var idx = parseInt(node.getAttribute('data-h'), 10);
        if (!HEROES[idx]) return;
        HERO = HEROES[idx];
        save.hero = idx; writeSave();
        beep(720, 0.08, 'sine', 0.04, 1.25);
        showTitle();
      };
    })(hbs[q]);
  }

  var tbs = panel.querySelectorAll('[data-t]');
  for (var j = 0; j < tbs.length; j++){
    (function(btn){
      btn.onclick = function(){
        var key = btn.getAttribute('data-t'), def = null;
        for (var m = 0; m < TALENTS.length; m++) if (TALENTS[m].k === key) def = TALENTS[m];
        var lv = save.t[key];
        if (!def || lv >= 3) return;
        var c = def.cost[lv];
        if (save.coins < c) return;
        save.coins -= c; save.t[key] = lv + 1;
        writeSave();
        beep(880, 0.1, 'sine', 0.05, 1.2);
        showTitle();
      };
    })(tbs[j]);
  }
}

function calcScore(win){
  var sc = game.killed * 12 + game.maxCombo * 18 + (game.stage + 1) * 120
    + game.perfects * 40 + (win ? 260 : 0) - game.hitsTaken * 8;
  return Math.max(0, Math.round(sc));
}

function showResult(win){
  game.combo = 0; game.comboT = 0;
  var sec = Math.round(game.time);
  var mm = Math.floor(sec / 60), ss = ('0' + (sec % 60)).slice(-2);
  var score = calcScore(win);
  var grade = score >= 1100 ? 'S' : (score >= 800 ? 'A' : (score >= 500 ? 'B' : 'C'));
  var coins = Math.round((Math.round(score / 10) + (win ? 30 : 0)) * D().coin);
  save.coins += coins; save.runs++;
  if (win) save.wins++;
  if (score > save.best) save.best = score;
  writeSave();

  var html = '';
  if (win){
    html += '<div class="badge">18:00 · 打卡成功</div><h1>你下班了</h1>' +
      '<p class="sub">走出公司大门的那一刻，晚风是甜的。</p>';
  } else {
    html += '<div class="badge">21:40 · 还在公司</div><h1>你被留下了</h1>' +
      '<p class="sub">"这个需求今晚就要，辛苦一下。"<br>你的工位灯，还亮着。</p>';
  }
  html += '<div class="grade">' + grade + '</div>' +
    '<div class="stats">得分 <b>' + score + '</b>　摸鱼币 <b>+' + coins + '</b><br>' +
    '用时 <b>' + mm + ':' + ss + '</b>　最高连击 <b>' + game.maxCombo + '</b><br>' +
    '完美闪避 <b>' + game.perfects + '</b>　挨批 <b>' + game.hitsTaken + '</b>　放倒 <b>' + game.killed + '</b></div>' +
    '<div class="meta">本局英雄 ' + HERO.name + '<br>最高分 ' + save.best + '　累计摸鱼币 ' + save.coins + '</div>' +
    '<div class="row"><button id="againBtn">再来一局（R）</button>' +
    '<button id="menuBtn" class="ghost">换个岗位（M）</button></div>';
  showOverlay(html);
  var ab = document.getElementById('againBtn'), mb = document.getElementById('menuBtn');
  if (ab) ab.onclick = start;
  if (mb) mb.onclick = backToMenu;
}

/* 回到主菜单：可以重新选岗位 */
function backToMenu(){
  game.state = 'title';
  game.enemies.length = 0; game.shots.length = 0; game.zones.length = 0;
  game.parts.length = 0; game.texts.length = 0; game.fx.length = 0;
  game.bossRef = null;
  hideOverlay();
  showTitle();
}

/* =============== 主循环 =============== */
var last = performance.now();
function loop(now){
  var dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (game.state === 'play'){
    if (game.hitstop > 0){
      game.hitstop -= dt;
    } else {
      update(dt);
    }
    render();
    syncHUD();
  } else {
    render();
  }

  for (var k in pressed) delete pressed[k];
  requestAnimationFrame(loop);
}

loadSave();
if (HEROES[save.hero]) HERO = HEROES[save.hero];
showTitle();
render();
requestAnimationFrame(loop);

// 调试句柄（便于自动化验证，不影响正常游玩）
window.__g = { game: game, P: P, cds: cds, start: start, startStage: startStage,
  spawnBoss: spawnBoss, spawnEnemy: spawnEnemy, winGame: winGame, loseGame: loseGame,
  nextWave: nextWave, offerCards: offerCards, getBuffs: function(){ return buffs; },
  cardPick: function(i){ if (cardPick) cardPick(i); }, save: function(){ return save; },
  heroes: HEROES, hero: function(){ return HERO; },
  setHero: function(i){ if (HEROES[i]) HERO = HEROES[i]; return HERO.name; },
  castSkill: castSkill, rollDrop: rollDrop, doHit: doPlayerHit, weapons: WEAPONS,
  stages: STAGES, diffs: DIFFS, ekinds: EKIND, boses: BOSS, emove: EMOVE, acts: ACT,
  diff: function(){ return DIFF; }, setDiff: function(i){ if (DIFFS[i]) { DIFF = i; save.diff = i; } return D().name; },
  damageEnemy: damageEnemy, breakBoss: breakBoss, arena: function(){ return game.arena; } };

})();
</script>
